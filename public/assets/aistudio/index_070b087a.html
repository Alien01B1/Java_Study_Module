  WG.recursion = function () {
    const w = widgetShell('Visual', 'mem', 'Recursion: activation records on the call stack', 'Each call to {{factorial}} gets its own activation record (frame) with its own {{n}}. Frames are pushed on the way down and popped on the way back up.');
    const id = uid('rn');
    const r = range(id, 1, 6, 3);
    const chip = make('span', 'chip');
    const f = field('n', r);
    f.appendChild(chip);
    w.appendChild(codeBlock({ src: 'static int factorial(int n) {\n    if (n <= 1) {\n        return 1;\n    }\n    return n * factorial(n - 1);\n}', title: 'Recursive factorial' }, { noOut: true }).node);
    const pic = make('div', 'svgwrap');
    const note = make('p', 'note-line');
    let steps = [], idx = 0, timer = null;
    const bNext = btn('Next ▶', 'small primary', () => go(idx + 1));
    bNext.dataset.role = 'trace-next';
    const bBack = btn('◀ Back', 'small', () => go(idx - 1));
    const bPlay = btn('▶▶ Play', 'small mint', () => {
      if (timer) { clearInterval(timer); timer = null; bPlay.textContent = '▶▶ Play'; return; }
      if (idx >= steps.length - 1) go(0);
      bPlay.textContent = '⏸ Pause';
      timer = setInterval(() => { if (idx >= steps.length - 1) { clearInterval(timer); timer = null; bPlay.textContent = '▶▶ Play'; } else go(idx + 1); }, 800);
    });
    const count = make('span', 'count');
    const stepper = make('div', 'stepper');
    stepper.append(bBack, bNext, bPlay, count);
    function build(n) {
      steps = [];
      const stack = [];
      const fact = (k) => {
        stack.push({ n: k, ret: null });
        steps.push({ stack: stack.map((x) => Object.assign({}, x)), note: 'Call factorial(' + k + '): push a new frame with n = ' + k + '.' });
        let res;
        if (k <= 1) res = 1;
        else {
          const sub = fact(k - 1);
          res = k * sub;
        }
        stack[stack.length - 1].ret = res;
        steps.push({ stack: stack.map((x) => Object.assign({}, x)), note: k <= 1 ? 'Base case: n = ' + k + ' so return 1.' : 'factorial(' + (k - 1) + ') returned ' + res / k + ', so return ' + k + ' × ' + res / k + ' = ' + res + '.' });
        stack.pop();
        return res;
      };
      const total = fact(n);
      steps.push({ stack: [], note: 'All frames popped. main receives factorial(' + n + ') = ' + total + '.' });
    }
    function go(k) {
      idx = Math.max(0, Math.min(steps.length - 1, k));
      const s = steps[idx];
      const H = 60 + (+r.value + 1) * 52;
      let svg = '<svg viewBox="0 0 520 ' + H + '" role="img" aria-label="Recursion stack">';

      s.stack.forEach((fr, i) => {
        const y = H - 52 - (i + 1) * 52;
        const top = i === s.stack.length - 1;
        svg += '<rect x="20" y="' + y + '" width="240" height="44" rx="14" fill="' + (top ? '#c9efdf' : '#f8f5fd') + '" stroke="#b9acdf"/>';
        svg += '<text x="34" y="' + (y + 27) + '" font-size="14" font-weight="800" class="mono" fill="#272238">factorial(' + fr.n + ')</text>';
        svg += '<text x="250" y="' + (y + 27) + '" text-anchor="end" font-size="13" class="mono" fill="#544d69">n = ' + fr.n + '</text>';
        if (fr.ret != null) svg += '<text x="276" y="' + (y + 27) + '" font-size="13" font-weight="800" class="mono" fill="#1f7a4d">returns ' + fr.ret + '</text>';
        svg += '<path d="M262,' + (y + 22) + ' C300,' + (y + 22) + ' 300,' + (y + 74) + ' 262,' + (y + 74) + '" fill="none" stroke="#c0569b" stroke-width="1.2" stroke-dasharray="3 3"/>';
      });
      svg += '<text x="330" y="40" font-size="12.5" fill="#544d69">dashed curve = control link</text><text x="330" y="58" font-size="12.5" fill="#544d69">("who called me?")</text>';
      svg += '</svg>';
      pic.innerHTML = svg;
      note.textContent = s.note;
      count.textContent = 'Step ' + (idx + 1) + ' / ' + steps.length;
      bBack.disabled = idx === 0;
      bNext.disabled = idx === steps.length - 1;
    }
    r.addEventListener('input', () => {
      chip.textContent = 'factorial(' + r.value + ')';
      build(+r.value);
      go(0);
    });
    chip.textContent = 'factorial(' + r.value + ')';
    build(+r.value);
    w.append(f, stepper, note, pic);
    go(0);
    return w;
  };

  WG.quicksort = function () {
    const w = widgetShell('Visual', 'mem', 'Generic quicksort, one comparison at a time', 'The algorithm never looks inside the objects. It only calls {{a[i].cmp(a[j])}}. Yellow bars are being compared, purple is the pivot, green is in its final place.');
    let arr, steps, idx;
    const pic = make('div', 'svgwrap');
    const note = make('p', 'note-line');

    const bNext = btn('Next ▶', 'small primary', () => go(idx + 1));

    const bEnd = btn('Skip to end ⏭', 'small', () => go(steps.length - 1));
    const bShuffle = btn('🔀 New data', 'small butter', () => init());
    const stepper = make('div', 'stepper');
    stepper.append(bBack, bNext, bEnd, bShuffle, count);
    function init(fixed) {
      arr = fixed || Array.from({ length: 8 }, () => 1 + Math.floor(Math.random() * 20));
      steps = [];
      const a = arr.slice();
      const done = new Set();
      let cmps = 0;
      const snap = (note, hi, piv) => steps.push({ a: a.slice(), hi: hi || [], piv, done: new Set(done), note, cmps });
      snap('Start: ' + a.join(', '));
      const qs = (lo, hi) => {
        if (lo > hi) return;
        if (lo === hi) { done.add(lo); snap('Single element at index ' + lo + ' is in place.'); return; }
        const p = a[hi];
        let i = lo;
        for (let j = lo; j < hi; j++) {
          cmps++;
          const less = a[j] < p;
          snap('Compare a[' + j + '] = ' + a[j] + ' with pivot ' + p + ': ' + (less ? 'smaller, move it left.' : 'not smaller, leave it.'), [j], hi);
          if (less) { [a[i], a[j]] = [a[j], a[i]]; i++; }
        }
        [a[i], a[hi]] = [a[hi], a[i]];
        done.add(i);
        snap('Put pivot ' + p + ' at index ' + i + ': everything left of it is smaller.', [], i);
        qs(lo, i - 1);
        qs(i + 1, hi);
      };
      qs(0, a.length - 1);
      for (let k = 0; k < a.length; k++) done.add(k);
      snap('Sorted: ' + a.join(', ') + '. Comparisons used: ' + cmps + '.');
      go(0);
    }
    function go(k) {
      idx = Math.max(0, Math.min(steps.length - 1, k));
      const s = steps[idx];
      const max = Math.max(...s.a);
      let svg = '<svg viewBox="0 0 520 210" role="img" aria-label="Quicksort bars">';
      s.a.forEach((v, i) => {
        const h = 20 + (v / max) * 140;
        const fill = s.done.has(i) ? '#9be0bf' : i === s.piv ? '#b9a6ff' : s.hi.includes(i) ? '#ffe17a' : '#cfe5ff';
        svg += '<rect x="' + (20 + i * 61) + '" y="' + (175 - h) + '" width="50" height="' + h + '" rx="12" fill="' + fill + '" stroke="#8a7fb5"/>';
        svg += '<text x="' + (45 + i * 61) + '" y="' + (168 - h) + '" text-anchor="middle" font-size="14" font-weight="800" class="mono" fill="#272238">' + v + '</text>';
        svg += '<text x="' + (45 + i * 61) + '" y="196" text-anchor="middle" font-size="12" class="mono" fill="#6f6887">[' + i + ']</text>';
      });
      svg += '</svg>';
      pic.innerHTML = svg;
      note.textContent = s.note;
      count.textContent = 'Step ' + (idx + 1) + ' / ' + steps.length + ' · comparisons so far: ' + s.cmps;
      bBack.disabled = idx === 0;
      bNext.disabled = idx === steps.length - 1;
    }
    w.append(stepper, note, pic);
    init([9, 3, 14, 7, 1, 12, 5, 10]);

  };

  /* ---- Collections playground (List / Set behaviour, real HashSet order) ---- */
  WG.collections = function () {
    const w = widgetShell('Playground', 'play', 'Collections playground', 'Same calls, different collection. Watch duplicates, ordering and the boolean that {{add}} returns.');
    const i1 = uid('ct'), i2 = uid('cv');
    const type = sel(i1, [['ArrayList', 'ArrayList<String>'], ['LinkedList', 'LinkedList<String>'], ['HashSet', 'HashSet<String>'], ['LinkedHashSet', 'LinkedHashSet<String>'], ['TreeSet', 'TreeSet<String>']], 'HashSet');
    const val = make('input'); val.type = 'text'; val.id = i2; val.value = 'kiwi'; val.maxLength = 12;
    let items, log;
    const reset = () => { items = ['pear', 'apple', 'fig', 'apple']; log = []; replay(); };
    let state;
    const replay = () => {
      state = [];
      const L = [];
      items.forEach((op) => apply(op, L));
      log = L;
      render();
    };
    const isSet = () => type.value.endsWith('Set');
    function apply(op, L) {
      const rm = op.startsWith('-');
      const v = rm ? op.slice(1) : op;
      if (rm) {
        const k = state.indexOf(v);
        if (k >= 0) state.splice(k, 1);
        L.push('c.remove("' + v + '") → ' + (k >= 0));
      } else {
        const dup = state.includes(v);
        if (isSet() && dup) L.push('c.add("' + v + '") → false (already there)');
        else { state.push(v); L.push('c.add("' + v + '") → true'); }
      }
    }
    function view() {
      const t = type.value;
      if (t === 'TreeSet') return state.slice().sort((a, b) => cmpStr(a, b));
      if (t === 'HashSet') {
        const adds = [];
        const removed = [];
        items.forEach((op) => {
          if (op.startsWith('-')) { const v = op.slice(1); if (adds.includes(v) && !removed.includes(v)) removed.push(v); }
          else if (removed.includes(op)) { removed.splice(removed.indexOf(op), 1); adds.splice(adds.indexOf(op), 1); adds.push(op); }
          else if (!adds.includes(op)) adds.push(op);
        });
        return gen.hashRemove(adds, removed);
      }
      return state.slice();
    }
    const pic = make('div', 'console');
    const expl = make('div', 'feedback info');
    const row = make('div', 'row');
    row.append(field('Collection', type), field('value', val),
      btn('add(value)', 'small primary', () => { if (val.value) { items.push(val.value); replay(); } }),
      btn('remove(value)', 'small rose', () => { if (val.value) { items.push('-' + val.value); replay(); } }),
      btn('Reset', 'small butter', reset));
    function render() {

  /* ---- Mark and sweep ---- */
  WG.gc = function () {
    const w = widgetShell('Visual', 'mem', 'Garbage collection: mark and sweep', 'Roots are variables on the stack. Mark everything reachable from them; sweep (free) everything else, including the unreachable cycle E ⇄ F.');
    const N = { A: [150, 40], B: [150, 130], C: [300, 40], D: [300, 130], E: [450, 60], F: [450, 150] };
    const edges = [['A', 'C'], ['B', 'D'], ['C', 'D'], ['E', 'F'], ['F', 'E']];
    const roots = [['p', 'A'], ['q', 'B']];
    let phase = 0, marked = new Set(), swept = false, order = [];
    const bfs = () => {
      const seen = [];
      const queue = roots.map((r) => r[1]);
      while (queue.length) {
        const x = queue.shift();
        if (seen.includes(x)) continue;
        seen.push(x);
        edges.filter((e) => e[0] === x).forEach((e) => queue.push(e[1]));
      }
      return seen;
    };
    const pic = make('div', 'svgwrap');
    const note = make('p', 'note-line');
    const row = make('div', 'stepper');
    const bNext = btn('Next ▶', 'small primary', () => step());
    bNext.dataset.role = 'trace-next';
    row.append(bNext, btn('Reset', 'small butter', () => { phase = 0; marked = new Set(); swept = false; render(); }));
    function step() {
      if (!order.length) order = bfs();
      if (marked.size < order.length) marked.add(order[marked.size]);
      else swept = true;
      phase++;
      render();
    }
    function render() {
      order = bfs();
      let s = '<svg viewBox="0 0 540 210" role="img" aria-label="Object graph"><defs><marker id="gA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b3fd0"/></marker></defs>';
      s += '<rect x="10" y="20" width="80" height="150" rx="16" fill="#c9efdf" stroke="#8fc7ad"/><text x="50" y="40" text-anchor="middle" font-size="12" font-weight="800" fill="#145a3a">STACK</text>';
      roots.forEach(([v, t], k) => {
        const y = 70 + k * 80;
        s += '<text x="30" y="' + (y + 5) + '" font-size="14" font-weight="800" class="mono">' + v + '</text><circle cx="62" cy="' + y + '" r="5" fill="#5b3fd0"/>';
        s += '<path d="M62,' + y + ' C100,' + y + ' 110,' + (N[t][1] + 22) + ' ' + (N[t][0] - 2) + ',' + (N[t][1] + 22) + '" fill="none" stroke="#5b3fd0" stroke-width="2" marker-end="url(#gA)"/>';
      });
      edges.forEach(([a, b]) => {
        if (swept && (!marked.has(a) || !marked.has(b))) return;
        const [x1, y1] = N[a], [x2, y2] = N[b];
        const dy = a === 'F' ? 10 : a === 'E' ? -10 : 0;
        s += '<path d="M' + (x1 + 30) + ',' + (y1 + 22 + dy) + ' L' + (x2 + (x2 > x1 ? 0 : 60)) + ',' + (y2 + 22 + dy) + '" fill="none" stroke="#5b3fd0" stroke-width="2" marker-end="url(#gA)"/>';
      });
      Object.keys(N).forEach((k) => {
        if (swept && !marked.has(k)) return;
        const [x, y] = N[k];
        s += '<rect x="' + (k === 'C' || k === 'D' ? x : x - (x > 400 ? 0 : 0)) + '" y="' + y + '" width="60" height="44" rx="14" fill="' + (marked.has(k) ? '#9be0bf' : '#ffd9c4') + '" stroke="#b9acdf" stroke-width="1.5"/><text x="' + (x + 30) + '" y="' + (y + 28) + '" text-anchor="middle" font-size="16" font-weight="800" class="mono">' + k + (marked.has(k) ? ' ✓' : '') + '</text>';
      });
      s += '</svg>';
      pic.innerHTML = s;
      note.textContent = swept ? 'Sweep: E and F were never marked, so their memory is returned to free space, even though they point at each other.' : marked.size ? 'Mark phase: ' + [...marked].join(', ') + ' reached from the roots.' : 'Press Next to start marking from the roots p and q.';
      bNext.disabled = swept;
    }
    w.append(row, note, pic);
    render();
    return w;
  };

    let depth = 0, cur = null;
    const tops = [];
    const re = /\b(class|interface|enum|record)\s+(\w+)/y;
    for (let i = 0; i < clean.length; i++) {
      const c = clean[i];

      mapped: opt(sq === null ? null : sq * 100),
      code: 'double x = ' + jd(x) + ';\nOptional<Double> step1 = inverse(x);\nOptional<Double> result = step1.flatMap(Main::squareRoot);\nSystem.out.println(step1);\nSystem.out.println(result);\nSystem.out.println(result.orElse(-1.0));\nSystem.out.println(result.map(v -> v * 100));',

  // Mutual exclusion protocols
  const MUTEX = {
    turn: {
      label: 'Attempt 1: shared turn',
      lines: (i, j) => ['while (turn != ' + i + ') { }   // busy wait', '// critical section', 'turn = ' + j + ';'],
      init: () => ({ turn: 1 }),
      can: (s, t) => true,
      act(s, t) {
        const i = t + 1, j = 2 - t;
        const pc = s.pc[t];
        if (pc === 0) { if (s.v.turn === i) s.pc[t] = 1; else return 'waits: turn is ' + s.v.turn; }
        else if (pc === 1) s.pc[t] = 2;
        else { s.v.turn = j; s.pc[t] = 0; }
        return null;
      },
      vars: (s) => 'turn = ' + s.v.turn,
    },
    request: {
      label: 'Attempt 2: request flags',
      lines: (i, j) => ['request_' + i + ' = true;', 'while (request_' + j + ') { }   // busy wait', '// critical section', 'request_' + i + ' = false;'],
      init: () => ({ r1: false, r2: false }),
      act(s, t) {
        const me = t ? 'r2' : 'r1', other = t ? 'r1' : 'r2';
        const pc = s.pc[t];
        if (pc === 0) { s.v[me] = true; s.pc[t] = 1; }
        else if (pc === 1) { if (!s.v[other]) s.pc[t] = 2; else return 'waits: request_' + (2 - t) + ' is true'; }
        else if (pc === 2) s.pc[t] = 3;
        else { s.v[me] = false; s.pc[t] = 0; }
        return null;
      },
      vars: (s) => 'request_1 = ' + s.v.r1 + ', request_2 = ' + s.v.r2,
    },
    peterson: {
      label: 'Peterson\'s algorithm',
      lines: (i, j) => ['request_' + i + ' = true;', 'turn = ' + j + ';', 'while (request_' + j + ' && turn != ' + i + ') { }', '// critical section', 'request_' + i + ' = false;'],
      init: () => ({ r1: false, r2: false, turn: 1 }),
      act(s, t) {
        const i = t + 1, j = 2 - t, me = t ? 'r2' : 'r1', other = t ? 'r1' : 'r2';
        const pc = s.pc[t];
        if (pc === 0) { s.v[me] = true; s.pc[t] = 1; }
        else if (pc === 1) { s.v.turn = j; s.pc[t] = 2; }
        else if (pc === 2) { if (s.v[other] && s.v.turn !== i) return 'waits: request_' + j + ' is true and turn is ' + s.v.turn; s.pc[t] = 3; }
        else if (pc === 3) s.pc[t] = 4;
        else { s.v[me] = false; s.pc[t] = 0; }
        return null;
      },
      vars: (s) => 'request_1 = ' + s.v.r1 + ', request_2 = ' + s.v.r2 + ', turn = ' + s.v.turn,
    },
  };
  const CS_LINE = { turn: 1, request: 2, peterson: 3 };
  const WAIT_LINE = { turn: 0, request: 1, peterson: 2 };
  WG.mutex = function () {
    const w = widgetShell('Playground', 'play', 'Mutual exclusion protocols, step by step', 'You are the scheduler again. Step the two threads in any order and try to break each protocol: get both into the critical section, block both forever, or starve one.');
    const id = uid('mx');
    const s = sel(id, Object.keys(MUTEX).map((k) => [k, MUTEX[k].label]), 'request');
    let st;
    const two = make('div', 'two');
    const vars = make('div', 'console');
    const fb = make('div');
    const row = make('div', 'row');
    const b1 = btn('Step Thread 1', 'small primary', () => step(0));
    const b2 = btn('Step Thread 2', 'small primary', () => step(1));
    const bQuit = btn('Thread 2 shuts down', 'small rose', () => { st.dead = !st.dead; bQuit.textContent = st.dead ? 'Thread 2 restarts' : 'Thread 2 shuts down'; render(); });
    row.append(b1, b2, bQuit, btn('Reset', 'small butter', () => reset()));
    function reset() { const P = MUTEX[s.value]; st = { pc: [0, 0], v: P.init(), msg: [], dead: false, entries: [0, 0] }; bQuit.textContent = 'Thread 2 shuts down'; render(); }
    function step(t) {
      if (t === 1 && st.dead) return;
      const P = MUTEX[s.value];
      const before = st.pc[t];
      const wait = P.act(st, t);
      if (st.pc[t] === CS_LINE[s.value] && before !== CS_LINE[s.value]) st.entries[t]++;
      st.msg.push('Thread ' + (t + 1) + (wait ? ' ' + wait : ': ran "' + P.lines(t + 1, 2 - t)[before] + '"'));
      render();
    }
    function blocked(t) {
      const P = MUTEX[s.value];
      const clone = { pc: st.pc.slice(), v: Object.assign({}, st.v) };
      return st.pc[t] === WAIT_LINE[s.value] && P.act(clone, t) !== null;
    }
    function render() {
      const P = MUTEX[s.value];
      const col = (t) => '<div class="panel"><h4>Thread ' + (t + 1) + (t === 1 && st.dead ? ' (shut down)' : '') + ' · entered critical section ' + st.entries[t] + '×</h4>' + P.lines(t + 1, 2 - t).map((l, i) => '<div class="var' + (i === st.pc[t] ? ' changed' : '') + '"' + (i === CS_LINE[s.value] ? ' style="outline:2px dashed #c0569b"' : '') + '><span class="vn">' + (i === st.pc[t] ? '▶' : '') + '</span><span class="vv">' + esc(l) + '</span></div>').join('') + '</div>';
      two.innerHTML = col(0) + col(1);
      vars.innerHTML = '<b>' + esc(P.vars(st)) + '</b>\n' + st.msg.slice(-5).map(esc).join('\n');
      b2.disabled = st.dead;
      const both = st.pc[0] === CS_LINE[s.value] && st.pc[1] === CS_LINE[s.value];
      const dead = blocked(0) && (st.dead || blocked(1));
      let html = '';
      if (both) html = '<div class="feedback badf"><b>Both threads are in the critical section!</b> Mutual exclusion is broken.</div>';
      else if (dead && !st.dead) html = '<div class="feedback badf"><b>Deadlock:</b> each thread is waiting for the other, and neither can ever move again.</div>';
      else if (dead && st.dead) html = '<div class="feedback badf"><b>Starvation:</b> Thread 1 waits forever because Thread 2 has shut down and will never take its turn.</div>';
      else html = '<div class="feedback info">' + { turn: 'Hint: let Thread 1 go through once, then shut Thread 2 down.', request: 'Hint: step Thread 1 once, then Thread 2 once, then keep stepping both.', peterson: 'Try anything: Peterson\'s algorithm never lets both in, never deadlocks, and copes with Thread 2 shutting down.' }[s.value] + '</div>';
      fb.innerHTML = html;
    }
    s.addEventListener('change', reset);
    w.append(field('Protocol', s), row, two, vars, fb);
    reset();
    return w;
  };

  // One-way bridge simulation
  WG.bridge = function () {
    const w = widgetShell('Playground', 'play', 'The one-way bridge', 'Cars take 2 ticks to cross. Add cars going North or South and advance time. The log uses the same messages as {{enter}} and {{leave}} in the notes.');
    let st;
    const reset = () => { st = { dir: true, count: 0, on: [], wait: [], next: 1, log: [], t: 0 }; render(); };
    const name = (d) => (d ? 'North' : 'South');
    function tryEnter(car) {
      if (car.d !== st.dir && st.count > 0) return false;
      if (car.d !== st.dir) { st.dir = car.d; st.log.push('Car ' + car.id + ' switches bridge direction to ' + name(car.d)); }
      st.count++;
      st.on.push({ id: car.id, d: car.d, left: 2 });
      st.log.push('Car ' + car.id + ' going ' + name(car.d) + ' enters bridge');
      return true;
    }
    function arrive(d) {
      const car = { id: st.next++, d };
      if (!tryEnter(car)) { st.wait.push(car); st.log.push('Car ' + car.id + ' going ' + name(d) + ' stuck'); }
      render();
    }
    function tick() {
      st.t++;
      st.on.forEach((c) => c.left--);
      const leaving = st.on.filter((c) => c.left <= 0);

  // Producer-consumer with a blocking queue
  WG.prodcons = function () {
    const w = widgetShell('Playground', 'play', 'Producer and consumer with a blocking queue', 'put() blocks when the queue is full; take() blocks when it is empty. Change the speeds and watch who ends up waiting.');
    const i1 = uid('pc'), i2 = uid('pp'), i3 = uid('pq');
    const cap = range(i1, 1, 5, 3), ps = range(i2, 1, 4, 1), cs = range(i3, 1, 4, 2);
    const chips = [make('span', 'chip'), make('span', 'chip'), make('span', 'chip')];
    const fields = [field('Queue capacity', cap), field('Producer acts every … ticks', ps), field('Consumer acts every … ticks', cs)];
    fields.forEach((f, k) => f.appendChild(chips[k]));
    const row = make('div', 'row');
    row.append(...fields);
    let st, timer = null;
    const reset = () => { st = { q: [], t: 0, next: 1, pBlocked: false, cBlocked: false, log: [], done: 0 }; stop(); render(); };
    function tick() {
      st.t++;
      const C = +cap.value;
      if (st.t % +ps.value === 0 || st.pBlocked) {
        if (st.q.length < C) { st.q.push(st.next); st.log.push('t=' + st.t + '  producer: put(' + st.next + ')'); st.next++; st.pBlocked = false; }
        else if (!st.pBlocked) { st.pBlocked = true; st.log.push('t=' + st.t + '  producer: queue full, BLOCKED in put()'); }
      }
      if (st.t % +cs.value === 0 || st.cBlocked) {
        if (st.q.length) { const v = st.q.shift(); st.done++; st.log.push('t=' + st.t + '  consumer: take() → ' + v); st.cBlocked = false; }
        else if (!st.cBlocked) { st.cBlocked = true; st.log.push('t=' + st.t + '  consumer: queue empty, BLOCKED in take()'); }
      }
      render();
    }
    function stop() { if (timer) clearInterval(timer); timer = null; if (bAuto) bAuto.textContent = '▶▶ Auto'; }
    const b = make('div', 'stepper');
    const bTick = btn('Tick ▶', 'small primary', tick);
    bTick.dataset.role = 'tick';
    const bAuto = btn('▶▶ Auto', 'small mint', () => { if (timer) return stop(); bAuto.textContent = '⏸ Pause'; timer = setInterval(() => (st.t > 60 ? stop() : tick()), 600); });
    b.append(bTick, bAuto, btn('Reset', 'small butter', reset));
    const pic = make('div', 'svgwrap');
    const con = make('div', 'console');
    function render() {
      chips[0].textContent = cap.value; chips[1].textContent = ps.value; chips[2].textContent = cs.value;
      const C = +cap.value;
      let s = '<svg viewBox="0 0 600 120" role="img" aria-label="Queue">';
      s += '<rect x="10" y="30" width="110" height="60" rx="14" fill="' + (st.pBlocked ? '#ffd3df' : '#c9efdf') + '"/><text x="65" y="58" text-anchor="middle" font-size="13" font-weight="800">Producer</text><text x="65" y="76" text-anchor="middle" font-size="11">' + (st.pBlocked ? 'BLOCKED' : 'running') + '</text>';
      for (let k = 0; k < 5; k++) {
        const x = 150 + k * 62;
        const on = k < C;
        s += '<rect x="' + x + '" y="35" width="54" height="50" rx="12" fill="' + (!on ? '#eeeaf5' : k < st.q.length ? '#ffd9c4' : '#fff') + '" stroke="' + (on ? '#b9acdf' : '#e2dcef') + '"' + (on ? '' : ' stroke-dasharray="4 4"') + '/>';
        if (k < st.q.length) s += '<text x="' + (x + 27) + '" y="66" text-anchor="middle" font-size="15" font-weight="800" class="mono">' + st.q[k] + '</text>';
      }
      s += '<rect x="470" y="30" width="120" height="60" rx="14" fill="' + (st.cBlocked ? '#ffd3df' : '#c9efdf') + '"/><text x="530" y="58" text-anchor="middle" font-size="13" font-weight="800">Consumer</text><text x="530" y="76" text-anchor="middle" font-size="11">' + (st.cBlocked ? 'BLOCKED' : 'running') + '</text>';
      s += '<text x="300" y="110" text-anchor="middle" font-size="12" fill="#544d69">tick ' + st.t + ' · consumed ' + st.done + ' items</text></svg>';
      pic.innerHTML = s;
      con.innerHTML = st.log.length ? st.log.slice(-6).map(esc).join('\n') : '<span class="muted">Press Tick or Auto.</span>';
    }
    [cap, ps, cs].forEach((c) => c.addEventListener('input', render));
    w.append(row, b, pic, con);
    reset();
    return w;
  };

  // Swing simulator: a fake window driven by the same listener logic as the notes
  WG.swing = function (o) {
    const mode = o.mode || 'one';
    const titles = { one: 'ButtonTest', three: '3 Buttons', multicast: 'Multicast', checkbox: 'Checkbox' };
    const w = widgetShell('Simulation', 'play', o.title || 'Try the GUI', o.sub || 'This is an HTML imitation of the Swing window from the course notes, wired with the same listener logic. Click the components and read the event log.');
    const COLORS = { red: '#ff3b30', yellow: '#ffd60a', blue: '#2f6bff', green: '#30c04f', none: '#eeeeee' };
    let bg, closed, log, multicast, boxes;
    const reset = () => { bg = mode === 'multicast' ? ['none', 'none'] : ['none']; closed = false; log = []; multicast = true; boxes = { red: false, blue: false }; render(); };
    const frame = make('div', 'swing-frame');
    const con = make('div', 'console');
    const row = make('div', 'row');
    const bMulti = btn('Multicast: ON', 'small', () => { multicast = !multicast; bMulti.textContent = 'Multicast: ' + (multicast ? 'ON' : 'OFF'); log.push(multicast ? 'b1.addListener(b2); b2.addListener(b1);  // both panels listen to all six buttons' : '(listeners removed: each panel hears only its own buttons)'); render(); });
    if (mode === 'multicast') row.append(bMulti);
    row.append(btn('Reset', 'small butter', reset));
    function click(panel, which) {
      if (mode === 'one') { bg[0] = 'red'; log.push('redButton pushed → ButtonPanel.actionPerformed(evt) → setBackground(Color.red); repaint();'); }
      else if (mode === 'three') { bg[0] = which; log.push('actionPerformed(evt): evt.getSource() == ' + which + 'Button → setBackground(Color.' + which + ')'); }
      else if (mode === 'multicast') {
        const cmd = which.toUpperCase();
        const targets = multicast ? [0, 1] : [panel];
        targets.forEach((p) => (bg[p] = which));
        log.push('Panel ' + (panel + 1) + ' ' + which + ' button: action command "' + cmd + '" → actionPerformed in ' + (multicast ? 'b1 and b2 (both listening)' : 'panel ' + (panel + 1) + ' only'));
      }
      render();
    }
    function tick(which) {
      boxes[which] = !boxes[which];
      let c = bg[0];
      if (boxes.blue) c = 'blue';
      if (boxes.red) c = 'red';
      if (boxes.blue && boxes.red) c = 'green';
      bg[0] = c;
      log.push(which + 'Box clicked (now ' + (boxes[which] ? 'selected' : 'not selected') + ') → actionPerformed: red=' + boxes.red + ', blue=' + boxes.blue + ' → ' + (c === 'none' ? 'keep current colour' : 'Color.' + c));
      render();
    }
    function panelHtml(p) {
      const btns = mode === 'one' ? ['red'] : ['yellow', 'blue', 'red'];
      if (mode === 'checkbox') return '<div class="swing-panel" style="background:' + COLORS[bg[0]] + '"><label class="swing-check"><input type="checkbox" data-box="red"' + (boxes.red ? ' checked' : '') + '> Red</label><label class="swing-check"><input type="checkbox" data-box="blue"' + (boxes.blue ? ' checked' : '') + '> Blue</label></div>';
      return '<div class="swing-panel" style="background:' + COLORS[bg[p]] + '">' + btns.map((b) => '<button type="button" class="swing-btn" data-p="' + p + '" data-b="' + b + '">' + b[0].toUpperCase() + b.slice(1) + '</button>').join('') + '</div>';
    }
    function render() {
      if (closed) {
        frame.innerHTML = '<div class="swing-closed">Window closed: windowClosing(e) called System.exit(0).<br><button type="button" class="btn small" data-reopen="1">Run the program again</button></div>';
      } else {
        frame.innerHTML = '<div class="swing-title"><span>' + titles[mode] + '</span><span class="swing-ctrls"><span>–</span><span>□</span><button type="button" class="swing-x" aria-label="Close window">✕</button></span></div>' +
          (mode === 'multicast' ? panelHtml(0) + panelHtml(1) : panelHtml(0));
      }
      frame.querySelectorAll('.swing-btn').forEach((b) => b.addEventListener('click', () => click(+b.dataset.p, b.dataset.b)));
      frame.querySelectorAll('input[data-box]').forEach((b) => b.addEventListener('change', () => tick(b.dataset.box)));
      const x = frame.querySelector('.swing-x');
      if (x) x.addEventListener('click', () => { closed = true; log.push('Close clicked → WindowEvent → windowClosing(e) → System.exit(0)'); render(); });
      const re = frame.querySelector('[data-reopen]');
      if (re) re.addEventListener('click', () => { closed = false; log.push('EventQueue.invokeLater(…) creates a new ButtonFrame and calls setVisible(true)'); render(); });
      con.innerHTML = log.length ? log.slice(-6).map(esc).join('\n') : '<span class="muted">Event log: click something in the window.</span>';
    }
    w.append(row, frame, con);
    reset();
    return w;
  };

        b.type = 'button';
        b.addEventListener('click', () => {
          if (c.dataset.done) return;
          c.dataset.done = '1';
          answered++;
          const ok = oi === q.a;
          if (ok) correct++;
          opts.querySelectorAll('.opt').forEach((x, xi) => {
            x.disabled = true;
            if (xi === q.a) x.classList.add('right');
          });
          if (!ok) b.classList.add('wrong');
          fb.innerHTML = '<div class="feedback ' + (ok ? 'good' : 'badf') + '"><div class="' + (ok ? 'ok-msg' : 'bad-msg') + '">' + (ok ? '✅ Correct!' : '❌ Not quite. The answer is ' + keys[q.a] + '.') + '</div><div class="why"></div></div>';
          renderBody(q.why, fb.querySelector('.why'));
          updBar();
        });
        opts.appendChild(b);
      });
      c.append(opts, fb);
      list.appendChild(c);
    });
    page.appendChild(list);
    const final = make('div');
    page.appendChild(final);
    page.appendChild(pager(r));
    updBar();
    return page;
  }

  function renderCheat(r) {
    const page = make('article', 'page');
    page.style.maxWidth = '1100px';
    const head = make('header', 'clay page-head butter');
    head.innerHTML = '<h1>' + esc(cheat.title) + '</h1><p class="lede">' + md(cheat.intro) + '</p>';
    page.appendChild(head);
    const grid = make('div', 'cheat');
    cheat.cards.forEach((cd) => {
      const c = make('section', 'clay card' + (cd.color ? ' ' + cd.color : ''));
      c.appendChild(make('h2', '', md(cd.title)));
      cd.blocks.forEach((b) => c.appendChild(renderBlock(b)));
      grid.appendChild(c);
    });
    page.appendChild(grid);
    page.appendChild(pager(r));
    return page;
  }

  function route() {
    let id = (location.hash || '').replace(/^#/, '');
    if (!byRoute[id]) id = 'home';
    const r = byRoute[id];
    const main = document.getElementById('main');
    main.innerHTML = '';
    let page;
    try {
      page = r.kind === 'home' ? renderHome() : r.kind === 'section' ? renderSection(r) : r.kind === 'quiz' ? renderQuiz(r) : renderCheat(r);
    } catch (e) {
      console.error(e);
      page = make('div', 'clay page-head', '<h1>Something went wrong</h1><p>This page could not be displayed. Try another section.</p>');
    }
    main.appendChild(page);
    if (r.kind !== 'home') {
      Store.d.visited[r.id] = true;
      Store.d.last = r.id;
      Store.save();
    }
    document.title = (r.kind === 'home' ? '' : r.title + ' · ') + 'Java Study Companion';
    updateChrome(r);
    G.scrollTo(0, 0);
    try { main.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
  }
  Core.route = route;

  // Keep SVGs at (or below) their natural size so text never balloons on wide screens.
  function fitSvgs(root) {
    root.querySelectorAll('svg[viewBox]:not([data-fit])').forEach((svg) => {
      svg.setAttribute('data-fit', '1');
      if (svg.getAttribute('width')) return;
      const vb = svg.getAttribute('viewBox').split(/\s+/).map(Number);
      if (vb[2]) svg.style.maxWidth = 'min(100%, ' + Math.round(vb[2] * 1.1) + 'px)';
    });
  }
  Core.start = function () {
    Store.load();
    const mainEl = document.getElementById('main');
    if (G.MutationObserver) new MutationObserver(() => fitSvgs(mainEl)).observe(mainEl, { childList: true, subtree: true });
    buildRoutes();
    buildSidebar();
    const mb = document.getElementById('menuBtn');
    if (mb) mb.addEventListener('click', () => document.body.classList.toggle('nav-open'));
    const ov = document.getElementById('overlay');
    if (ov) ov.addEventListener('click', () => document.body.classList.remove('nav-open'));
    G.addEventListener('hashchange', route);
    G.addEventListener('keydown', (e) => e.key === 'Escape' && document.body.classList.remove('nav-open'));
    route();
  };
  Core.routes = () => routes;
})(typeof window !== 'undefined' ? window : globalThis);

        body: [
          P('A **language** is a medium for communication. A **programming language** is a medium for communicating computational instructions, from humans to machines (and to other humans who will read the code later).'.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')),

            ['Typical examples', 'C, C++, and Java\'s {{javac}}', 'Python, and the classic JVM bytecode interpreter'],
            ['Errors found', 'Many (e.g. type errors) before the program ever runs', 'Usually only when the bad line is reached'],

          P('The trade-off: we give up some control over exactly how code maps onto the hardware (and some raw efficiency), but we make far fewer errors caused by a mismatch between what we <i>meant</i> and what we <i>wrote</i>.'),
          Code({
            title: 'The same idea in Java',
            src: J`

              }`,
            out: J`total = 7`,
          }),
          Exam('From the course notes\' practice quiz: <b>registers are in the CPU and they allow computation</b>. Memory stores values but does not compute. Both a compiler and an interpreter convert high-level code into low-level machine code; neither converts the other way.'),
          Hood('Java does both. {{javac}} <i>compiles</i> your source into bytecode for the Java Virtual Machine (JVM). The JVM then <i>interprets</i> that bytecode and, for code that runs often, compiles it further into real machine code while the program runs (Just-In-Time compilation). You will see this in Week 2.'),
          Extra('What a CPU register actually is', [
            P('A register is a tiny, extremely fast storage cell inside the processor, typically 64 bits wide on a modern laptop. A CPU has only a handful (x86-64 has 16 general-purpose ones), compared with billions of bytes of main memory. Reading a register takes well under a nanosecond; fetching from main memory can take around 100 times longer, which is why CPUs also keep caches of recently used memory.'),

          H('The role of types'),
          OL([
            '<b>Interpreting data consistently</b>: the same 32 bits can be read as an integer, a float or four characters.',
            '<b>Naming concepts</b>: a {{Point}} is clearer than a pair {{(float, float)}}; in a banking app, accounts and customers are different types.',
            '<b>Catching bugs early</b>: like a dimension mismatch in physics (adding metres to seconds), adding a string to a date is probably a mistake.',
          ]),
          H('Dynamic vs static typing'),
          Table(['', 'Dynamic typing (Python)', 'Static typing (Java)'], [
            ['Type is attached to', 'the current <b>value</b>', 'the <b>name</b> (variable), declared in advance'],
            ['{{x = 10}} then {{x = 7.5}}', 'Fine: x is now a float', '{{int x = 10;}} then {{x = 7.5;}} is a compile error'],
            ['Uninitialised name', 'Has no type at all', 'Has its declared type'],
            ['Type errors found', 'When the line runs', 'When you compile, before running'],
          ]),
          P('"Isn\'t it convenient that we don\'t have to declare variables in Python?" Yes, but typos become new variables instead of errors:'),
          Code({
            title: 'A typo Python cannot catch', lang: 'python',
            src: J`
              def factors(n):
                  factorlist = []
                  for i in range(1, n+1):
                      if n % i == 0:
                          factorlst = factorlist + [i]   # Typo! creates a new variable
                  return(factorlist)

              print(factors(12))`,
            out: '[]',
          }),
          P('Python happily runs this and returns an empty list. In Java, using an undeclared name like {{factorlst}} is a compile-time error, so the typo is caught immediately.'),
          Verdict({
            title: 'Static typing in action',
            sub: 'Each snippet runs inside {{main}}. Decide what happens.',
            items: [
              { src: 'int x = 10;\nx = 7.5;', v: 'compile', why: 'x was declared {{int}}. {{7.5}} is a {{double}} and cannot be stored in an int without an explicit cast, so javac reports "possible lossy conversion from double to int".' },
              { src: 'int x = 10;\ndouble y = x;\nSystem.out.println(y);', v: 'ok', out: '10.0', why: 'Going from int to double is a safe <i>widening</i> conversion, done automatically. It prints {{10.0}}.' },
              { src: 'int total = 0;\ntotl = total + 5;', v: 'compile', why: 'The typo {{totl}} was never declared: "cannot find symbol". Python would have silently created a new variable.' },
              { src: 'String s = "5";\nint n = s;', v: 'compile', why: 'A String is not an int. Use {{Integer.parseInt(s)}} to convert.' },
            ],
          }),
          H('Types for organising concepts'),
          P('Even simple type <b>synonyms</b> help: a 2D point is a pair {{(float, float)}} and a 3D point a triple. Naming them {{point2d}} and {{point3d}} makes the intent clear when writing, reading and maintaining code. More elaborate types (abstract data types and objects) go further: in a banking application, deposits and withdrawals apply to <i>accounts</i>, while updating personal details applies to <i>customers</i>. Separate types make it impossible to mix them up.'),
          H('Static analysis'),
          P('Finding errors as early as possible saves cost and effort. In general, no compiler can guarantee that a program will work correctly: that is undecidable, by Alan Turing\'s <b>halting problem</b>. But with variable declarations, a compiler <i>can</i> detect type errors at compile time. This is <b>static analysis</b>.'),

            'Dynamic typing catches these errors only when the code runs, and checking types while running also slows execution.',
            'Static analysis also enables <b>optimisations</b>: reordering statements to optimise reads and writes, and storing previously computed expressions to reuse later.',
          ]),

          P('Some languages deduce types automatically from context. From {{x = 7}} followed by {{y = x + 15}}, a compiler can infer that {{y}} must be an int. If the inferred types are consistent across the program, all is well. Java supports a limited form of this with {{var}} (Week 8).'),
          Code({
            title: 'Java inferring a type with var (Java 10+)',
            src: J`

    interface Iterator {                 // our own version, as in the notes
        boolean has_next();
        Object get_next();
    }

    class Linearlist {
        private Node head;
        private int size;

        private class Node {
            Object data;
            Node next;
            Node(Object d) { data = d; }
        }

        public void append(Object o) {
            Node n = new Node(o);
            if (head == null) {          // the empty list needs its own case
                head = n;
            } else {
                Node m;
                for (m = head; m.next != null; m = m.next) { }
                m.next = n;
            }
            size++;
        }

        private class Iter implements Iterator {
            private Node position;
            public Iter() { position = head; }          // start at the beginning
            public boolean has_next() { return position != null; }
            public Object get_next() {
                Object o = position.data;
                position = position.next;               // remember where we are
                return o;
            }
        }

        public Iterator get_iterator() {                // export a fresh iterator
            return new Iter();
        }
    }`;

            title: 'Generic quicksort over an interface',
            src: J`
              interface Comparable {            // our own interface, as in the notes
                  int cmp(Comparable s);        // interface methods are public and abstract
              }

              class SortFunctions {
                  public static void quicksort(Comparable[] a) { quicksort(a, 0, a.length - 1); }

                  private static void quicksort(Comparable[] a, int lo, int hi) {
                      if (lo >= hi) return;
                      Comparable pivot = a[hi];
                      int i = lo;
                      for (int j = lo; j < hi; j++) {
                          if (a[j].cmp(pivot) < 0) {          // the ONLY thing quicksort knows
                              Comparable t = a[i]; a[i] = a[j]; a[j] = t;
                              i++;
                          }
                      }
                      Comparable t = a[i]; a[i] = a[hi]; a[hi] = t;
                      quicksort(a, lo, i - 1);
                      quicksort(a, i + 1, hi);
                  }
              }

              abstract class Shape {
                  public abstract double perimeter();
              }

              class Circle extends Shape implements Comparable {   // one parent, plus a capability
                  private double r;
                  public Circle(double r) { this.r = r; }
                  public double perimeter() { return 2 * Math.PI * r; }
                  public int cmp(Comparable s) {
                      if (s instanceof Circle) {
                          double other = ((Circle) s).r;      // cast to reach s's radius
                          if (r < other) return -1;
                          if (r > other) return 1;
                      }
                      return 0;
                  }
                  public String toString() { return "Circle(" + r + ")"; }
              }

                  public static void main(String[] args) {
                      Circle[] cs = { new Circle(3), new Circle(1), new Circle(2.5), new Circle(0.5) };

                      System.out.println(java.util.Arrays.toString(cs));

            src: J`
              interface Queue<E> {
                  void add(E element);
                  E remove();
                  int size();
              }

              class CircularArrayQueue<E> implements Queue<E> {
                  private Object[] data = new Object[4];
                  private int head = 0, tail = 0, count = 0;

                  public void add(E element) {
                      if (count == data.length) throw new IllegalStateException("Queue full");
                      data[tail] = element;
                      tail = (tail + 1) % data.length;     // wrap around
                      count++;
                  }

                  @SuppressWarnings("unchecked")
                  public E remove() {
                      E e = (E) data[head];
                      data[head] = null;
                      head = (head + 1) % data.length;
                      count--;
                      return e;
                  }

                  public int size() { return count; }
              }

              class LinkedListQueue<E> implements Queue<E> {
                  private class Node { E val; Node next; Node(E v) { val = v; } }
                  private Node head, tail;
                  private int count = 0;

                  public void add(E element) {
                      Node n = new Node(element);
                      if (tail == null) { head = n; tail = n; }
                      else { tail.next = n; tail = n; }
                      count++;
                  }

                  public E remove() {
                      E e = head.val;
                      head = head.next;
                      if (head == null) tail = null;
                      count--;
                      return e;
                  }

                  public int size() { return count; }
              }

                      q.add("Ravi");
                      q.add("Sita");

                      q.add("Zoya");
                      while (q.size() > 0) System.out.print(q.remove() + " ");

                  }

        private boolean direction = true;    // true is North, false is South

            try {

            } catch (InterruptedException e) { }
            leave(id);                       // get off the bridge
        }

            // While there are cars going in the wrong direction
            while (d != direction && bcount > 0) {
                date = new Date();
                System.out.println("Car " + id + " going " + direction_name(d) + " stuck at " + date);

                } catch (InterruptedException e) { }

            bcount--;                        // "check out"
            // If everyone on the bridge has checked out, notify the cars waiting on the opposite side
            if (bcount == 0) {
                notifyAll();
            }
        }

            import java.util.concurrent.*;
            import java.util.concurrent.locks.*;

            public class Counter {
                private int n = 0;
                private final Lock lock = new ReentrantLock();

                public synchronized void inc() { n++; }          // monitor: one thread at a time
                public void incLocked() {
                    lock.lock();
                    try { n++; } finally { lock.unlock(); }       // always unlock in finally
                }

                public static void main(String[] args) throws InterruptedException {
                    Counter c = new Counter();
                    Runnable r = () -> { for (int i = 0; i < 1000; i++) { c.inc(); c.incLocked(); } };
                    Thread t1 = new Thread(r), t2 = new Thread(r);
                    t1.start(); t2.start();                       // start(), never run()
                    t1.join();  t2.join();                        // wait for both to finish
                    System.out.println(c.n);

                    new Thread(() -> { try { for (int i = 1; i <= 3; i++) q.put(i); } catch (InterruptedException e) { } }).start();

            import javax.swing.*;

            public class ButtonPanel extends JPanel implements ActionListener {
                private JButton red = new JButton("Red"), blue = new JButton("Blue");

                public ButtonPanel() {
                    red.addActionListener(this);     // no listener → event is lost
                    blue.addActionListener(this);
                    add(red);
                    add(blue);
                }

                public void actionPerformed(ActionEvent evt) {
                    Object src = evt.getSource();     // or evt.getActionCommand()
                    if (src == red) setBackground(Color.red);
                    else if (src == blue) setBackground(Color.blue);
                    repaint();
                }

                        f.setSize(300, 200);
                        f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);
                        f.getContentPane().add(new ButtonPanel());
                        f.setVisible(true);
