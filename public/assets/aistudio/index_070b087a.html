<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Java Study Companion</title>
  <meta name="description" content="An interactive Java study companion for Weeks 1–12: explanations, verified and runnable code, tracers, memory diagrams, playgrounds and quizzes.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Nunito:wght@400;600;700;800&display=swap">
  <style>
/* Java Study Companion — claymorphism design system
   Layout idea: soft lavender room; a clay sidebar of weeks on the left, one moulded reading column on the right. */
:root {
  color-scheme: light;
  --bg: #efeaf8;
  --bg-2: #e6e0f3;
  --surface: #f8f5fd;
  --lav: #ddd3ff;
  --mint: #c9efdf;
  --peach: #ffd9c4;
  --sky: #cfe5ff;
  --butter: #fff0b3;
  --rose: #ffd3df;
  --ink: #272238;
  --ink-soft: #544d69;
  --ink-faint: #6f6887;
  --accent: #5b3fd0;
  --accent-2: #4029a8;
  --good: #1f7a4d;
  --good-bg: #d3f3e2;
  --bad: #b3261e;
  --bad-bg: #ffdcd8;
  --code-bg: #29243d;
  --code-bg-2: #332d4b;
  --code-ink: #ece8fb;
  --font-display: "Baloo 2", "Nunito", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r-lg: 30px;
  --r-md: 24px;
  --r-sm: 16px;
  --shadow-out: 10px 12px 24px rgba(92, 72, 150, .17), -8px -8px 18px rgba(255, 255, 255, .85);
  --shadow-in: inset 4px 4px 9px rgba(255, 255, 255, .75), inset -6px -6px 12px rgba(92, 72, 150, .13);
  --shadow-press: inset 6px 6px 12px rgba(92, 72, 150, .22), inset -4px -4px 9px rgba(255, 255, 255, .7);
  --shadow-small: 5px 6px 12px rgba(92, 72, 150, .18), -4px -4px 10px rgba(255, 255, 255, .85);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 84px; }
body {
  margin: 0;
  background: var(--bg);
  background-image: radial-gradient(circle at 12% 8%, #f7f2ff 0, transparent 38%), radial-gradient(circle at 90% 85%, #e5f3ff 0, transparent 40%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.65;
}
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; color: var(--ink); margin: 0; }
h1 { font-size: clamp(1.9rem, 4vw, 2.6rem); font-weight: 800; }
h2 { font-size: 1.55rem; font-weight: 700; }
h3 { font-size: 1.28rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); }
a:hover { color: var(--accent-2); }
code { font-family: var(--font-mono); font-size: .86em; background: rgba(91, 63, 208, .1); color: #3b2a8c; padding: .08em .38em; border-radius: 8px; overflow-wrap: anywhere; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 10px; }
.skip { position: absolute; left: -999px; top: 8px; z-index: 99; background: var(--surface); padding: 8px 14px; border-radius: 12px; }
.skip:focus { left: 12px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- clay primitives ---------- */
.clay {
  background: var(--surface);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-out), var(--shadow-in);
}
.clay.lav { background: var(--lav); } .clay.mint { background: var(--mint); } .clay.peach { background: var(--peach); }
.clay.sky { background: var(--sky); } .clay.butter { background: var(--butter); } .clay.rose { background: var(--rose); }

.btn {
  font: 700 15px/1.2 var(--font-body);
  color: var(--ink);
  background: var(--surface);
  border: 0;
  border-radius: 18px;
  padding: 10px 18px;
  min-height: 42px;
  cursor: pointer;
  box-shadow: var(--shadow-small), var(--shadow-in);
  transition: transform .12s ease, box-shadow .12s ease, background .2s;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  text-decoration: none;
}
.btn:hover { background: #fff; }
.btn:active, .btn.pressed { transform: scale(.95) translateY(1px); box-shadow: var(--shadow-press); }
.btn.primary { background: var(--accent); color: #fff; box-shadow: 6px 8px 16px rgba(64, 41, 168, .35), inset 3px 3px 7px rgba(255, 255, 255, .35), inset -4px -4px 8px rgba(30, 10, 90, .35); }
.btn.primary:hover { background: var(--accent-2); color: #fff; }
.btn.primary:active { box-shadow: inset 5px 5px 10px rgba(20, 5, 70, .5), inset -3px -3px 8px rgba(255, 255, 255, .25); }
.btn.small { font-size: 13.5px; padding: 6px 12px; min-height: 34px; border-radius: 14px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; transform: none; }
.btn.mint { background: var(--mint); } .btn.peach { background: var(--peach); } .btn.sky { background: var(--sky); } .btn.butter { background: var(--butter); } .btn.lav { background: var(--lav); } .btn.rose { background: var(--rose); }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font: 700 13px/1 var(--font-body);
  padding: 7px 12px; border-radius: 999px;
  background: var(--surface);
  box-shadow: 3px 4px 8px rgba(92, 72, 150, .16), inset 2px 2px 4px rgba(255, 255, 255, .8), inset -3px -3px 6px rgba(92, 72, 150, .12);
  border: 0; color: var(--ink); cursor: default;
}
button.chip { cursor: pointer; transition: transform .1s; }
button.chip:active, button.chip.on { transform: scale(.94); box-shadow: inset 3px 3px 7px rgba(92, 72, 150, .25), inset -2px -2px 5px rgba(255, 255, 255, .7); }
button.chip.on { background: var(--lav); }

input[type="text"], input[type="number"], select, textarea {
  font: 600 15px/1.4 var(--font-body);
  color: var(--ink);
  background: #fbf9ff;
  border: 0;
  border-radius: 14px;
  padding: 9px 12px;
  box-shadow: inset 4px 4px 8px rgba(92, 72, 150, .18), inset -4px -4px 8px rgba(255, 255, 255, .9);
  min-height: 40px;
}
textarea { font-family: var(--font-mono); font-size: 14px; width: 100%; min-height: 96px; resize: vertical; }
input[type="number"] { width: 92px; }
label { font-weight: 700; font-size: 14px; color: var(--ink-soft); }

/* clay slider */
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; max-width: 280px; height: 16px; border-radius: 999px; background: var(--bg-2); box-shadow: inset 3px 3px 6px rgba(92, 72, 150, .22), inset -3px -3px 6px rgba(255, 255, 255, .8); margin: 8px 0; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; background: var(--peach); cursor: grab; box-shadow: 3px 4px 8px rgba(92, 72, 150, .3), inset 2px 2px 4px rgba(255, 255, 255, .8), inset -3px -3px 6px rgba(150, 80, 40, .2); transition: transform .1s; }
input[type="range"]:active::-webkit-slider-thumb { transform: scale(.88); cursor: grabbing; }
input[type="range"]::-moz-range-thumb { width: 28px; height: 28px; border: 0; border-radius: 50%; background: var(--peach); box-shadow: 3px 4px 8px rgba(92, 72, 150, .3), inset -3px -3px 6px rgba(150, 80, 40, .2); }

/* ---------- shell ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 12px;
  padding: 10px 18px;
  background: rgba(239, 234, 248, .86);
  backdrop-filter: blur(10px);
}
.brand { display: flex; align-items: center; gap: 10px; font: 800 1.2rem/1 var(--font-display); color: var(--ink); text-decoration: none; }
.brand-mark { width: 38px; height: 38px; border-radius: 14px; display: grid; place-items: center; background: var(--peach); box-shadow: var(--shadow-small), var(--shadow-in); font-size: 20px; }
.topbar .spacer { flex: 1; }
.top-progress { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 14px; color: var(--ink-soft); }
.top-progress .bar { width: 120px; }
#menuBtn { display: none; }

.shell { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 28px; padding: 8px 22px 40px; max-width: 1320px; margin: 0 auto; }
.sidebar { position: sticky; top: 74px; align-self: start; max-height: calc(100vh - 92px); overflow-y: auto; padding: 16px 12px; scrollbar-width: thin; }
.side-link { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 14px; color: var(--ink); text-decoration: none; font-weight: 700; font-size: 15px; line-height: 1.3; }
.side-link:hover { background: rgba(91, 63, 208, .08); }
.side-link.active { background: var(--surface); box-shadow: var(--shadow-press); color: var(--accent-2); }
.side-link .tick { margin-left: auto; width: 22px; height: 22px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 12px; color: transparent; box-shadow: inset 2px 2px 4px rgba(92, 72, 150, .2), inset -2px -2px 4px rgba(255, 255, 255, .8); }
.side-link .tick.on { color: #fff; background: var(--good); box-shadow: 2px 2px 5px rgba(31, 122, 77, .35); }
.side-week { margin: 6px 0; border-radius: 20px; }
.side-week > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 18px; font: 800 15.5px/1.2 var(--font-display); }
.side-week > summary::-webkit-details-marker { display: none; }
.side-week > summary:hover { background: rgba(91, 63, 208, .07); }
.side-week > summary .dot { width: 30px; height: 30px; border-radius: 11px; display: grid; place-items: center; font-size: 14px; box-shadow: var(--shadow-small), var(--shadow-in); flex: none; }
.side-week > summary .count { margin-left: auto; font: 700 12px/1 var(--font-body); color: var(--ink-faint); }
.side-week > summary .chev { transition: transform .2s; font-size: 12px; color: var(--ink-faint); }
.side-week[open] > summary .chev { transform: rotate(90deg); }
.side-week .side-items { padding: 2px 0 8px 18px; display: grid; gap: 2px; }
.side-week .side-link { font-weight: 600; font-size: 14.5px; padding: 6px 10px; }
.side-sep { height: 1px; background: rgba(92, 72, 150, .14); margin: 10px 8px; }

main { min-width: 0; outline: none; }
main:focus, main:focus-visible { outline: none; }
.page { max-width: 880px; display: grid; gap: 26px; }
.crumb { font-weight: 800; font-size: 14px; color: var(--ink-soft); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.page-head { padding: 26px 30px; display: grid; gap: 10px; }
.page-head .lede { color: var(--ink-soft); font-size: 1.05rem; max-width: 65ch; }

.goals { padding: 20px 26px; }
.goals h2 { font-size: 1.15rem; display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.goals ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }

.prose { display: grid; gap: 16px; }
.prose > p, .prose li { max-width: 72ch; }
.prose ul, .prose ol { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }
.prose h3 { margin-top: 10px; }
.prose table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 15px; }
.tablewrap { overflow-x: auto; border-radius: var(--r-md); box-shadow: var(--shadow-small), var(--shadow-in); background: var(--surface); }
.prose th, .prose td { text-align: left; padding: 9px 14px; vertical-align: top; }
.prose th { font-family: var(--font-display); font-size: 15px; background: var(--lav); }
.prose tr:nth-child(even) td { background: rgba(221, 211, 255, .25); }
.prose td code, .prose th code { white-space: nowrap; }

/* callouts */
.callout { padding: 16px 20px 16px 18px; border-radius: var(--r-md); display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; box-shadow: var(--shadow-small), var(--shadow-in); }
.callout .ico { font-size: 22px; line-height: 1.3; width: 34px; height: 34px; display: grid; place-items: center; background: rgba(255, 255, 255, .55); border-radius: 12px; box-shadow: inset 2px 2px 4px rgba(255, 255, 255, .8), inset -2px -2px 5px rgba(92, 72, 150, .14); }
.callout .lbl { font: 800 14px/1.2 var(--font-display); text-transform: uppercase; letter-spacing: .04em; color: var(--ink-soft); margin-bottom: 4px; }
.callout .cbody { display: grid; gap: 8px; min-width: 0; }
.callout.tip { background: var(--mint); }
.callout.warn { background: var(--peach); }
.callout.exam { background: var(--butter); }
.callout.hood { background: var(--sky); }
.callout.fix { background: var(--rose); }
.callout.analogy { background: var(--lav); }
.extra { padding: 20px 22px; border-radius: var(--r-lg); background: linear-gradient(160deg, #fffbe8, #fff3c4); box-shadow: var(--shadow-out), var(--shadow-in); display: grid; gap: 14px; }
.extra-tag { display: inline-flex; gap: 6px; align-items: center; font: 800 12px/1 var(--font-body); text-transform: uppercase; letter-spacing: .08em; background: #fff; padding: 6px 10px; border-radius: 999px; width: max-content; box-shadow: var(--shadow-small); color: #8a5a00; }

/* ---------- code ---------- */
.code { margin: 0; border-radius: var(--r-md); background: var(--code-bg); box-shadow: 10px 12px 24px rgba(40, 25, 90, .28), -6px -6px 14px rgba(255, 255, 255, .7), inset 3px 3px 7px rgba(255, 255, 255, .08), inset -5px -5px 12px rgba(0, 0, 0, .35); overflow: hidden; color: var(--code-ink); }
.code-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px 6px 18px; flex-wrap: wrap; }
.code-title { font: 700 14px/1.3 var(--font-body); color: #d9d2f5; }
.code-badge { font: 700 11.5px/1 var(--font-body); padding: 5px 9px; border-radius: 999px; background: rgba(255, 255, 255, .1); color: #cfc7ef; }
.code-badge.ok { background: rgba(110, 220, 160, .18); color: #a6f0c6; }
.code-badge.bad { background: rgba(255, 120, 110, .2); color: #ffb3ab; }
.code-head .spacer { flex: 1; }
.copy-btn { font: 700 12.5px/1 var(--font-body); color: #ece8fb; background: var(--code-bg-2); border: 0; border-radius: 12px; padding: 8px 12px; cursor: pointer; box-shadow: 3px 3px 7px rgba(0, 0, 0, .35), inset 2px 2px 3px rgba(255, 255, 255, .1); transition: transform .1s; }
.copy-btn:active { transform: scale(.93); box-shadow: inset 3px 3px 7px rgba(0, 0, 0, .5); }
.code-body { overflow-x: auto; padding: 4px 0 14px; }
.code-lines { display: table; min-width: 100%; font: 400 14px/1.6 var(--font-mono); counter-reset: ln; }
.cl { display: table-row; }
.cl > .ln { display: table-cell; width: 1%; padding: 0 12px 0 16px; text-align: right; color: #7d76a0; user-select: none; font-size: 12.5px; }
.cl > .lc { display: table-cell; padding: 0 18px 0 6px; white-space: pre; }
.cl.cur > .lc, .cl.cur > .ln { background: rgba(255, 214, 102, .2); }
.cl.cur > .ln { color: #ffd666; box-shadow: inset 4px 0 0 #ffd666; }
.cl.dim { opacity: .45; }
.cl.hit > .lc { background: rgba(120, 230, 170, .18); }
.cl.miss > .lc { background: rgba(255, 110, 100, .2); }
.code.clickable .cl { cursor: pointer; }
.code.clickable .cl:hover > .lc { background: rgba(255, 255, 255, .07); }
.code.clickable .cl:focus-visible { outline: 2px solid #ffd666; outline-offset: -2px; }
.tk-kw { color: #c8a6ff; font-weight: 600; }
.tk-ty { color: #7fd6ff; }
.tk-st { color: #b8ef9f; }
.tk-nu { color: #ffc985; }
.tk-co { color: #948db5; font-style: italic; }
.tk-an { color: #ffab8a; }
.tk-fn { color: #ffe38a; }
.tk-li { color: #ff9ec4; font-weight: 600; }
.tk-op { color: #e4def9; }
.out { background: #1e1a2e; border-top: 1px solid rgba(255, 255, 255, .06); padding: 10px 18px 14px; }
.out-h { font: 800 11.5px/1 var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: #9a92c0; margin-bottom: 8px; display: flex; gap: 8px; }
.out pre { margin: 0; font: 14px/1.55 var(--font-mono); color: #f1eefc; white-space: pre-wrap; overflow-wrap: anywhere; }
.out pre .err { color: #ffa29a; }
.out pre .inp { color: #8fe3ff; }
.code-note { padding: 0 18px 12px; font-size: 14px; color: #c8c0e8; }
.code-note code { background: rgba(255,255,255,.12); color: #f3eaff; box-shadow: none; }

/* ---------- widgets ---------- */
.widget { padding: 20px 22px; border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow-out), var(--shadow-in); display: grid; gap: 14px; min-width: 0; }
.widget-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.widget-head h3 { font-size: 1.15rem; }
.widget-tag { font: 800 11.5px/1 var(--font-body); text-transform: uppercase; letter-spacing: .08em; padding: 6px 10px; border-radius: 999px; background: var(--sky); color: #1e4b7a; }
.widget-sub { color: var(--ink-soft); font-size: 15px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.field { display: grid; gap: 4px; }
.two { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.panel { border-radius: var(--r-sm); background: var(--bg); box-shadow: inset 4px 4px 9px rgba(92, 72, 150, .16), inset -4px -4px 9px rgba(255, 255, 255, .85); padding: 12px 14px; min-width: 0; }
.panel h4 { font: 800 13px/1.2 var(--font-body); text-transform: uppercase; letter-spacing: .07em; color: var(--ink-soft); margin-bottom: 8px; }
.console { background: #1e1a2e; color: #f1eefc; font: 13.5px/1.55 var(--font-mono); border-radius: 16px; padding: 10px 14px; min-height: 52px; white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: inset 4px 4px 10px rgba(0, 0, 0, .5), inset -2px -2px 6px rgba(255, 255, 255, .06); }
.console .err { color: #ffa29a; }
.console .muted { color: #8d86ad; }
.vars { display: grid; gap: 6px; }
.var { display: flex; justify-content: space-between; gap: 10px; background: var(--surface); border-radius: 12px; padding: 6px 10px; font: 13.5px/1.4 var(--font-mono); box-shadow: 2px 3px 6px rgba(92, 72, 150, .12); }
.var .vn { color: var(--ink-soft); }
.var .vv { font-weight: 700; color: var(--ink); text-align: right; overflow-wrap: anywhere; }
.var.changed { background: var(--butter); animation: pop .35s ease; }
@keyframes pop { 0% { transform: scale(.94); } 60% { transform: scale(1.03); } 100% { transform: scale(1); } }
.frames { display: grid; gap: 6px; }
.frame { border-radius: 14px; padding: 7px 10px; background: var(--surface); box-shadow: 2px 3px 6px rgba(92, 72, 150, .12); font: 13px/1.4 var(--font-mono); }
.frame.top { background: var(--mint); font-weight: 700; }
.frame .fv { color: var(--ink-soft); font-weight: 400; display: block; overflow-wrap: anywhere; }
.stepper { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stepper .count { font: 800 14px/1 var(--font-body); color: var(--ink-soft); margin-left: 4px; }
.note-line { font-size: 15px; background: var(--butter); border-radius: 14px; padding: 8px 12px; box-shadow: var(--shadow-small); min-height: 40px; }
.svgwrap { overflow-x: auto; border-radius: var(--r-sm); background: var(--bg); box-shadow: inset 4px 4px 9px rgba(92, 72, 150, .16), inset -4px -4px 9px rgba(255, 255, 255, .85); padding: 10px; }
.svgwrap svg { display: block; max-width: 100%; height: auto; margin: 0 auto; }
.svgwrap.wide svg { max-width: none; }
svg text { font-family: var(--font-body); }
svg .mono { font-family: var(--font-mono); }
.fig { display: grid; gap: 8px; margin: 0; }
.fig figcaption { font-size: 14.5px; color: var(--ink-soft); text-align: center; }
.ok-msg { color: var(--good); font-weight: 800; }
.bad-msg { color: var(--bad); font-weight: 800; }
.feedback { border-radius: 16px; padding: 12px 16px; display: block; }
.feedback > * + * { margin-top: 8px; }
.feedback .why > * + *, .feedback .walk > * + * { margin-top: 8px; }
.feedback.good { background: var(--good-bg); }
.feedback.badf { background: var(--bad-bg); }
.feedback.info { background: var(--sky); }
.itable { width: 100%; border-collapse: separate; border-spacing: 0 4px; font: 13.5px/1.4 var(--font-mono); }
.itable th { font: 800 12px/1.2 var(--font-body); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); text-align: left; padding: 4px 8px; }
.itable td { background: var(--surface); padding: 6px 8px; }
.itable td:first-child { border-radius: 10px 0 0 10px; }
.itable td:last-child { border-radius: 0 10px 10px 0; }
.itable tr.no td { background: var(--rose); }
.scroll-y { max-height: 280px; overflow-y: auto; }

/* exercises */
.ex-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.ex-tag { font: 800 11.5px/1 var(--font-body); text-transform: uppercase; letter-spacing: .08em; padding: 6px 10px; border-radius: 999px; }
.ex-tag.pred { background: var(--peach); color: #7a3410; }
.ex-tag.bug { background: var(--rose); color: #8a1f3d; }
.ex-tag.verd { background: var(--mint); color: #145a3a; }
.ex-tag.trace { background: var(--butter); color: #6b4d00; }
.ex-tag.mem { background: var(--sky); color: #1e4b7a; }
.ex-tag.play { background: var(--lav); color: #3b2a8c; }
.shake { animation: shake .35s; }
@keyframes shake { 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }
.verdict-item { display: grid; gap: 10px; padding: 14px; border-radius: 18px; background: var(--bg); box-shadow: inset 3px 3px 7px rgba(92, 72, 150, .14), inset -3px -3px 7px rgba(255, 255, 255, .85); }
.verdict-item .code { box-shadow: 4px 5px 10px rgba(40, 25, 90, .2); }

/* quiz */
.qcard { padding: 20px 22px; display: grid; gap: 12px; }
.qnum { font: 800 13px/1 var(--font-body); color: var(--ink-soft); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.qtext { font-weight: 700; font-size: 1.05rem; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; font: 600 15.5px/1.45 var(--font-body); color: var(--ink); border: 0; padding: 11px 16px; border-radius: 16px; background: var(--surface); cursor: pointer; box-shadow: var(--shadow-small), var(--shadow-in); transition: transform .1s; display: flex; gap: 10px; align-items: flex-start; }
.opt .key { flex: none; width: 26px; height: 26px; border-radius: 9px; display: grid; place-items: center; font: 800 13px/1 var(--font-body); background: var(--lav); }
.opt pre { margin: 0; font: 14px/1.5 var(--font-mono); white-space: pre-wrap; }
.opt:active { transform: scale(.98); box-shadow: var(--shadow-press); }
.opt.right { background: var(--good-bg); box-shadow: inset 0 0 0 3px var(--good), var(--shadow-small); }
.opt.wrong { background: var(--bad-bg); box-shadow: inset 0 0 0 3px var(--bad), var(--shadow-small); }
.opt[disabled] { cursor: default; }
.scorebar { position: sticky; top: 70px; z-index: 5; padding: 12px 18px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.scorebar .big { font: 800 1.3rem/1 var(--font-display); }

/* progress */
.bar { height: 14px; border-radius: 999px; background: var(--bg-2); box-shadow: inset 3px 3px 6px rgba(92, 72, 150, .22), inset -2px -2px 5px rgba(255, 255, 255, .8); overflow: hidden; min-width: 60px; }
.bar > span { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #8f74ff, #5b3fd0); box-shadow: inset 2px 2px 4px rgba(255, 255, 255, .45); transition: width .5s ease; }

/* home */
.hero { padding: 30px 32px; display: grid; gap: 14px; background: linear-gradient(140deg, #f3eeff 0%, #e7f2ff 100%); }
.hero p { color: var(--ink-soft); max-width: 62ch; font-size: 1.05rem; }
.hero .row { margin-top: 4px; }
.weekgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 22px; }
.weekcard { padding: 20px; display: grid; gap: 10px; text-decoration: none; color: var(--ink); transition: transform .15s; align-content: start; }
.weekcard:hover { transform: translateY(-3px); }
.weekcard:active { transform: scale(.98); box-shadow: var(--shadow-press); }
.weekcard .wnum { font: 800 13px/1 var(--font-body); text-transform: uppercase; letter-spacing: .1em; color: var(--ink-soft); }
.weekcard h3 { font-size: 1.2rem; }
.weekcard .wtopics { font-size: 14.5px; color: var(--ink-soft); line-height: 1.5; }
.weekcard .wmeta { display: flex; justify-content: space-between; font: 700 13px/1 var(--font-body); color: var(--ink-soft); }
.legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.legend .callout { grid-template-columns: 30px 1fr; padding: 12px 14px; font-size: 14.5px; }

/* pager */
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 8px; }
.pager a { padding: 16px 20px; display: grid; gap: 4px; text-decoration: none; color: var(--ink); }

.pager .ttl { font: 700 1.05rem/1.3 var(--font-display); }
.pager .next { text-align: right; }

.cheat { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 22px; }
.cheat .card { padding: 18px 20px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.cheat .card h2 { font-size: 1.2rem; }
.cheat .card .code-lines { font-size: 13px; }
.cheat .card table { font-size: 14px; }

.overlay { display: none; }
.empty-note { color: var(--ink-faint); font-style: italic; }

  .top-progress .bar { width: 70px; }
  .two { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  body { font-size: 16.5px; }

  .pager { grid-template-columns: 1fr; }
  .pager .next { text-align: left; }
  .cheat { grid-template-columns: minmax(0, 1fr); }
  .top-progress .lbl { display: none; }
  .code-lines { font-size: 13px; }
  .brand span.long { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- runner ---------- */
.run-btn { background: #4a3d8f; }
.run-btn.on { background: #6b55d6; }

.runner-h { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font: 800 13px/1.2 var(--font-body); color: #d9d2f5; }
.runner textarea { background: #171327; color: #f1eefc; box-shadow: inset 3px 3px 8px rgba(0, 0, 0, .55), inset -2px -2px 6px rgba(255, 255, 255, .05); font: 13.5px/1.55 var(--font-mono); min-height: 140px; white-space: pre; overflow-wrap: normal; overflow-x: auto; tab-size: 4; }
.runner .runner-in { min-height: 60px; }
.runner-stdin summary { cursor: pointer; color: #cfc7ef; font: 700 13px/1.4 var(--font-body); }
.runner-row { display: flex; gap: 8px; flex-wrap: wrap; }
.runner-row .btn.off { opacity: .5; cursor: not-allowed; }
.runner-note { color: #b9b1d9; font-size: 13.5px; line-height: 1.5; }
.runner-note code { background: rgba(255, 255, 255, .1); color: #e7e0ff; }
.runner-out .feedback { color: var(--ink); }
.runner-result { display: grid; gap: 8px; }
.runner-status { font: 800 14px/1.3 var(--font-body); }
.runner-status.ok { color: #a6f0c6; }
.runner-status.bad { color: #ffb3ab; }
.runner-expl { color: #e3ddfa; font-size: 14.5px; }
.runner-disclaimer { color: #9a92c0; font-size: 12.5px; }
pre.console { margin: 0; }
/* ---------- swing simulator ---------- */
.swing-frame { max-width: 460px; border-radius: 10px; overflow: hidden; border: 1px solid #a9a3b8; box-shadow: 6px 8px 18px rgba(40, 30, 80, .25); background: #f2f2f2; font-family: "Segoe UI", system-ui, sans-serif; }
.swing-title { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: linear-gradient(#e9e9ee, #d6d6de); font-size: 13px; color: #222; }
.swing-ctrls { display: flex; gap: 10px; align-items: center; color: #555; }
.swing-x { border: 0; background: transparent; font-size: 14px; cursor: pointer; color: #333; padding: 0 4px; border-radius: 4px; }
.swing-x:hover { background: #e81123; color: #fff; }
.swing-panel { min-height: 120px; display: flex; gap: 8px; justify-content: center; align-items: flex-start; padding: 10px; transition: background .2s; }
.swing-btn { font: 13px "Segoe UI", system-ui, sans-serif; padding: 4px 14px; border: 1px solid #7a8aa6; border-radius: 3px; background: linear-gradient(#fdfdfd, #dfe4ec); cursor: pointer; color: #111; }
.swing-btn:active { background: #c8d1df; }
.swing-check { font: 13px "Segoe UI", system-ui, sans-serif; color: #111; display: inline-flex; gap: 4px; align-items: center; }
.swing-closed { padding: 30px 16px; text-align: center; color: #444; font-size: 14px; }

/* Watermark */
.watermark {
  position: fixed; right: 18px; bottom: 16px; z-index: 40; pointer-events: none; user-select: none;
  font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif; font-weight: 700; font-size: 14px; letter-spacing: .3px;
  color: #5b3fd0; background: rgba(255, 255, 255, .72); padding: 6px 14px; border-radius: 999px;
  box-shadow: 6px 6px 14px rgba(120, 100, 180, .18), -4px -4px 10px rgba(255, 255, 255, .9), inset 1px 1px 2px rgba(255, 255, 255, .9);

}
@media (max-width: 560px) { .watermark { right: 10px; bottom: 10px; font-size: 12px; padding: 4px 10px; opacity: .75; } }
@media print { .watermark { position: static; display: block; text-align: center; box-shadow: none; } }

<body>
  <a class="skip" href="#main" onclick="document.getElementById('main').focus();return false;">Skip to content</a>
  <header class="topbar">
    <button id="menuBtn" class="btn small" type="button" aria-label="Open the section menu" aria-controls="sidebar">☰ Menu</button>
    <a class="brand" href="#home"><span class="brand-mark" aria-hidden="true">☕</span><span>Java <span class="long">Study </span>Companion</span></a>
    <span class="spacer"></span>
    <div class="top-progress" id="topProgress" aria-live="polite"></div>
  </header>
  <div id="overlay" class="overlay"></div>
  <div class="shell">
    <nav id="sidebar" class="clay sidebar"></nav>
    <main id="main" tabindex="-1"></main>
  </div>
  <script>
/* Java Study Companion — core engine
   Routing, progress, Java highlighter, code blocks, callouts, quiz engine,
   tracer engine, memory visualiser and all interactive widgets.
   Week files call Core.week({...}); the cheat sheet calls Core.cheatsheet({...}). */
(function (G) {
  'use strict';
  const Core = (G.Core = {});
  const KEY = 'javaClayCompanion.v1';
  let UID = 0;
  const uid = (p) => (p || 'u') + ++UID;
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const md = (s) => String(s == null ? '' : s).replace(/\{\{([\s\S]+?)\}\}/g, (_, c) => '<code>' + esc(c) + '</code>');
  Core.esc = esc;
  Core.md = md;

  /* ---------- J`` : raw template tag with dedent (keeps Java backslashes intact) ---------- */
  function dedent(s) {
    s = s.replace(/^[ \t]*\n/, '').replace(/\s+$/, '');
    const lines = s.split('\n');
    const ind = Math.min(...lines.filter((l) => l.trim()).map((l) => l.match(/^ */)[0].length));
    return lines.map((l) => l.slice(isFinite(ind) ? ind : 0)).join('\n');
  }
  Core.J = function (strings, ...vals) {
    return dedent(String.raw({ raw: strings.raw }, ...vals));
  };
  Core.dedent = dedent;

  /* ---------- content builders (pure data, renderable later) ---------- */
  const B = (Core.B = {
    P: (html) => ({ t: 'p', html }),
    H: (text) => ({ t: 'h', text }),
    L: (items) => ({ t: 'ul', items }),
    OL: (items) => ({ t: 'ol', items }),
    Table: (head, rows) => ({ t: 'table', head, rows }),
    Code: (o) => Object.assign({ t: 'code' }, o),
    Tip: (body) => ({ t: 'call', kind: 'tip', body }),
    Warn: (body) => ({ t: 'call', kind: 'warn', body }),
    Exam: (body) => ({ t: 'call', kind: 'exam', body }),
    Hood: (body) => ({ t: 'call', kind: 'hood', body }),
    Fix: (body) => ({ t: 'call', kind: 'fix', body }),
    Analogy: (title, body) => ({ t: 'call', kind: 'analogy', title, body }),
    Extra: (title, blocks) => ({ t: 'extra', title, blocks }),
    Fig: (svg, caption) => ({ t: 'fig', svg, caption }),
    W: (name, o) => ({ t: 'w', name, o: o || {} }),
    Trace: (o) => ({ t: 'trace', o }),
    Mem: (o) => ({ t: 'mem', o }),
    Predict: (o) => ({ t: 'predict', o }),
    Bug: (o) => ({ t: 'bug', o }),
    Verdict: (o) => ({ t: 'verdict', o }),
    Raw: (html) => ({ t: 'raw', html }),
  });

  /* ---------- registry ---------- */
  const weeks = [];
  let cheat = null;
  Core.week = (def) => weeks.push(def);
  Core.cheatsheet = (def) => (cheat = def);
  Core.all = () => ({ weeks: weeks.slice().sort((a, b) => a.n - b.n), cheat });

  /* ---------- storage (optional) ---------- */
  const Store = {
    d: { visited: {}, quiz: {}, last: null },
    load() {
      try {
        const raw = G.localStorage && G.localStorage.getItem(KEY);
        if (raw) {
          const v = JSON.parse(raw);
          if (v && typeof v === 'object') {
            this.d.visited = v.visited || {};
            this.d.quiz = v.quiz || {};
            this.d.last = v.last || null;
          }
        }
      } catch (e) { /* storage unavailable: keep in memory */ }
    },
    save() {
      try { G.localStorage && G.localStorage.setItem(KEY, JSON.stringify(this.d)); } catch (e) { /* ignore */ }
    },
  };
  Core.Store = Store;

  /* =====================================================================
     Java / Python syntax highlighter
     ===================================================================== */
  const JKW = new Set(('abstract assert boolean break byte case catch char class const continue default do double else enum extends final finally float for goto if implements import instanceof int interface long native new package private protected public return short static strictfp super switch synchronized this throw throws transient try void volatile while var record yield sealed permits non-sealed').split(' '));
  const PYKW = new Set(('def return for in if elif else while class import from as lambda not and or is pass break continue with yield global nonlocal try except finally raise del assert').split(' '));
  function tokenize(src, lang) {
    const out = [];
    let i = 0;
    const n = src.length;
    const push = (t, s) => out.push({ t, s });
    if (lang === 'shell' || lang === 'text') {
      src.split('\n').forEach((line, k) => {
        if (k) push('', '\n');
        if (/^\s*(#|\/\/)/.test(line)) push('co', line);
        else if (/^\$ /.test(line)) { push('kw', '$ '); push('', line.slice(2)); }
        else push('', line);
      });
      return out;
    }
    const py = lang === 'python';
    while (i < n) {
      const rest = src.slice(i);
      let m;
      if (!py && (m = /^\/\/[^\n]*/.exec(rest))) push('co', m[0]);
      else if (!py && (m = /^\/\*[\s\S]*?(\*\/|$)/.exec(rest))) push('co', m[0]);
      else if (py && (m = /^#[^\n]*/.exec(rest))) push('co', m[0]);
      else if ((m = /^"(?:[^"\\\n]|\\.)*"?/.exec(rest))) push('st', m[0]);
      else if ((m = /^'(?:[^'\\\n]|\\.)*'?/.exec(rest))) push('st', m[0]);
      else if (!py && (m = /^@[A-Za-z_]\w*/.exec(rest))) push('an', m[0]);
      else if ((m = /^(?:0[xXbB][0-9a-fA-F_]+[lL]?|\d[\d_]*(?:\.[\d_]*)?(?:[eE][+-]?\d+)?[fFdDlL]?|\.\d+(?:[eE][+-]?\d+)?[fFdD]?)/.exec(rest))) push('nu', m[0]);
      else if ((m = /^[A-Za-z_$][\w$]*/.exec(rest))) {
        const w = m[0];
        const after = src.slice(i + w.length);
        if (!py && JKW.has(w)) push('kw', w);
        else if (py && PYKW.has(w)) push('kw', w);
        else if (w === 'true' || w === 'false' || w === 'null' || (py && (w === 'True' || w === 'False' || w === 'None' || w === 'self'))) push('li', w);
        else if (/^[A-Z]/.test(w)) push('ty', w);
        else if (/^\s*\(/.test(after)) push('fn', w);
        else push('', w);
      } else if ((m = /^\s+/.exec(rest))) push('', m[0]);
      else push('op', rest[0]), (m = [rest[0]]);
      i += m[0].length;
    }
    return out;
  }
  function hlLines(src, lang) {
    const lines = [''];
    tokenize(src, lang || 'java').forEach(({ t, s }) => {
      s.split('\n').forEach((part, k) => {
        if (k) lines.push('');
        if (part) lines[lines.length - 1] += t ? '<span class="tk-' + t + '">' + esc(part) + '</span>' : esc(part);
      });
    });
    return lines;
  }
  Core.hlLines = hlLines;

  /* ---------- tiny DOM helpers ---------- */
  function make(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function frag(html) {
    const t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }
  function btn(label, cls, onClick, title) {
    const b = make('button', 'btn ' + (cls || ''), label);
    b.type = 'button';
    if (title) b.title = title;
    if (onClick) b.addEventListener('click', onClick);
    return b;
  }
  function copyText(text, button) {
    const done = (ok) => {
      const old = button.dataset.label || button.textContent;
      button.dataset.label = old;
      button.textContent = ok ? 'Copied ✓' : 'Select & copy';
      setTimeout(() => (button.textContent = old), 1500);
    };
    const fallback = () => {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand && document.execCommand('copy');
        ta.remove();
        done(!!ok);
      } catch (e) { done(false); }
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => done(true), fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  /* ---------- code view ---------- */
  function codeLines(src, lang) {
    const box = make('div', 'code-lines');
    const rows = hlLines(src, lang).map((html, k) => {
      const r = make('div', 'cl', '<span class="ln">' + (k + 1) + '</span><span class="lc">' + (html || ' ') + '</span>');
      box.appendChild(r);
      return r;
    });
    return { box, rows };
  }
  function codeBlock(o, extra) {
    extra = extra || {};
    const lang = o.lang || 'java';
    const fig = make('figure', 'code');
    let badge = '';
    if (o.mode === 'bad') badge = '<span class="code-badge bad">✗ Does not compile</span>';
    else if (extra.badge) badge = extra.badge;
    else if (lang === 'python') badge = '<span class="code-badge">Python</span>';
    else if (lang === 'shell') badge = '<span class="code-badge">Terminal</span>';
    else if (o.nondet) badge = '<span class="code-badge ok">✓ Runs · output varies</span>';
    else if (o.out != null || o.err != null) badge = '<span class="code-badge ok">✓ Runs · output below</span>';
    else if (lang === 'java') badge = '<span class="code-badge ok">✓ Compiles</span>';
    const head = make('div', 'code-head', '<span class="code-title">' + md(o.title || (lang === 'java' ? 'Java' : lang === 'python' ? 'Python' : 'Terminal')) + '</span>' + badge + '<span class="spacer"></span>');
    const cb = make('button', 'copy-btn', 'Copy');
    cb.type = 'button';
    cb.setAttribute('aria-label', 'Copy code');
    cb.addEventListener('click', () => copyText(o.src, cb));
    head.appendChild(cb);
    if (extra.runnable && Core.attachRunner) Core.attachRunner(fig, o, head);
    fig.appendChild(head);
    const body = make('div', 'code-body');
    const { box, rows } = codeLines(o.src, lang);
    body.appendChild(box);
    fig.appendChild(body);
    if (o.input != null) {
      const inp = make('div', 'out', '<div class="out-h">⌨️ You type</div><pre class="inp-pre"></pre>');
      inp.querySelector('pre').innerHTML = '<span class="inp">' + esc(o.input) + '</span>';
      fig.appendChild(inp);
    }
    if (!extra.noOut && (o.out != null || o.err != null)) {
      const out = make('div', 'out', '<div class="out-h">▶ Output' + (o.nondet ? ' (one possible run)' : '') + '</div><pre></pre>');
      out.querySelector('pre').innerHTML = esc(o.out || '') + (o.err ? '<span class="err">' + esc(o.err) + '</span>' : '');
      fig.appendChild(out);
    }
    if (o.note) fig.appendChild(make('div', 'code-note', md(o.note)));
    return { node: fig, rows };
  }
  Core.codeBlock = codeBlock;

  /* =====================================================================
     Block renderer
     ===================================================================== */
  const CALL = {
    tip: ['💡', 'Tip'],
    warn: ['⚠️', 'Common mistake'],
    exam: ['🎯', 'Exam point'],
    hood: ['🔍', 'Under the hood'],
    fix: ['📌', 'Vital point to remember'],
    analogy: ['🧸', 'Real-world analogy'],
  };
  function renderBody(body, parent) {
    if (Array.isArray(body)) body.forEach((b) => parent.appendChild(renderBlock(b)));
    else String(body).split(/\n\s*\n/).forEach((para) => parent.appendChild(make('p', '', md(para.trim()))));
  }
  function renderBlock(b) {
    if (typeof b === 'string') return make('p', '', md(b));
    switch (b.t) {
      case 'p': return make('p', '', md(b.html));
      case 'h': return make('h3', '', md(b.text));
      case 'ul':
      case 'ol': {
        const l = make(b.t);
        b.items.forEach((it) => l.appendChild(make('li', '', md(it))));
        return l;
      }
      case 'raw': return frag('<div>' + b.html + '</div>');
      case 'table': {
        const wrap = make('div', 'tablewrap');
        const t = make('table');
        t.innerHTML = '<thead><tr>' + b.head.map((h) => '<th scope="col">' + md(h) + '</th>').join('') + '</tr></thead><tbody>' +
          b.rows.map((r) => '<tr>' + r.map((c) => '<td>' + md(c) + '</td>').join('') + '</tr>').join('') + '</tbody>';
        wrap.appendChild(t);
        return wrap;
      }
      case 'code': return codeBlock(b, { runnable: true }).node;
      case 'call': {
        const [ico, lbl] = CALL[b.kind];
        const c = make('aside', 'callout ' + b.kind);
        c.innerHTML = '<span class="ico" aria-hidden="true">' + ico + '</span><div class="cbody"><div class="lbl">' + esc(b.title ? lbl + ': ' + b.title : lbl) + '</div></div>';
        renderBody(b.body, c.querySelector('.cbody'));
        return c;
      }
      case 'extra': {
        const e = make('section', 'extra');
        e.innerHTML = '<span class="extra-tag">➕ Extra · beyond the syllabus</span><h3>' + md(b.title) + '</h3>';
        b.blocks.forEach((x) => e.appendChild(renderBlock(x)));
        return e;
      }
      case 'fig': {
        const f = make('figure', 'fig');
        f.innerHTML = '<div class="svgwrap">' + b.svg + '</div>' + (b.caption ? '<figcaption>' + md(b.caption) + '</figcaption>' : '');
        return f;
      }
      case 'w': {
        const fn = WG[b.name];
        if (!fn) return make('p', 'empty-note', 'Widget not found: ' + esc(b.name));
        return fn(b.o);
      }
      case 'trace': return traceWidget(b.o);
      case 'mem': return memWidget(b.o);
      case 'predict': return predictWidget(b.o);
      case 'bug': return bugWidget(b.o);
      case 'verdict': return verdictWidget(b.o);
      default: return make('p', 'empty-note', 'Unknown block');
    }
  }
  Core.renderBlock = renderBlock;

  function widgetShell(tag, tagCls, title, sub) {
    const w = make('section', 'widget');
    w.innerHTML = '<div class="widget-head"><span class="ex-tag ' + tagCls + '">' + esc(tag) + '</span><h3>' + md(title) + '</h3></div>' + (sub ? '<p class="widget-sub">' + md(sub) + '</p>' : '');
    return w;
  }

  /* =====================================================================
     Step-through code tracer
     steps: [line, [[frameName, {var: value}], ...bottom→top], outAppend, note]
     ===================================================================== */
  function fmtVal(v) {
    if (v === null) return 'null';
    if (typeof v === 'string') return v;
    return String(v);
  }
  function traceWidget(o) {
    const w = widgetShell('Code tracer', 'trace', o.title || 'Step through the program', o.sub || 'Press <b>Next</b> to run one step at a time. The yellow line is the one that <b>just ran</b>; the panels show the state right after it.');
    const two = make('div', 'two');
    const { node, rows } = codeBlock({ src: o.src, title: o.file || 'Main.java' }, { noOut: true, badge: '<span class="code-badge">Tracer</span>' });
    two.appendChild(node);
    const side = make('div');
    side.style.display = 'grid';
    side.style.gap = '12px';
    const pv = make('div', 'panel', '<h4>Variables (current method)</h4><div class="vars"></div>');
    const pf = make('div', 'panel', '<h4>Call stack (top = running)</h4><div class="frames"></div>');
    const pc = make('div', 'panel', '<h4>Console output</h4><div class="console"></div>');
    side.append(pv, pf, pc);
    two.appendChild(side);
    const note = make('p', 'note-line');
    const stepper = make('div', 'stepper');
    const steps = o.steps;
    let idx = 0;
    let timer = null;
    const bReset = btn('⏮ Reset', 'small', () => go(0));
    const bBack = btn('◀ Back', 'small', () => go(idx - 1));
    const bNext = btn('Next ▶', 'small primary', () => go(idx + 1));
    const bPlay = btn('▶▶ Play', 'small mint', () => {
      if (timer) return stop();
      if (idx >= steps.length - 1) go(0);
      bPlay.textContent = '⏸ Pause';
      timer = setInterval(() => (idx >= steps.length - 1 ? stop() : go(idx + 1)), 900);
    });
    bNext.dataset.role = 'trace-next';
    const count = make('span', 'count');
    stepper.append(bReset, bBack, bNext, bPlay, count);
    function stop() {
      clearInterval(timer);
      timer = null;
      bPlay.textContent = '▶▶ Play';
    }
    function go(k) {
      k = Math.max(0, Math.min(steps.length - 1, k));
      const prev = k > 0 ? steps[k - 1] : null;
      idx = k;
      const [line, frames, , txt] = steps[k];
      rows.forEach((r, i) => r.classList.toggle('cur', i === line - 1));
      const top = frames[frames.length - 1] || ['', {}];
      const prevTop = prev ? (prev[1].find((f) => f[0] === top[0]) || ['', {}]) : ['', {}];
      const vars = pv.querySelector('.vars');
      const names = Object.keys(top[1]);
      vars.innerHTML = names.length ? '' : '<span class="empty-note">No local variables yet</span>';
      names.forEach((n) => {
        const v = fmtVal(top[1][n]);
        const changed = prev && fmtVal(prevTop[1][n]) !== v;
        vars.appendChild(make('div', 'var' + (changed ? ' changed' : ''), '<span class="vn">' + esc(n) + '</span><span class="vv">' + esc(v) + '</span>'));
      });
      const fr = pf.querySelector('.frames');
      fr.innerHTML = '';
      frames.slice().reverse().forEach((f, i) => {
        const vs = Object.keys(f[1]).map((n) => n + ' = ' + fmtVal(f[1][n])).join(', ');
        fr.appendChild(make('div', 'frame' + (i === 0 ? ' top' : ''), esc(f[0]) + (vs ? '<span class="fv">' + esc(vs) + '</span>' : '')));
      });
      if (!frames.length) fr.innerHTML = '<span class="empty-note">Stack is empty: the program has finished</span>';
      let out = '';
      for (let j = 0; j <= k; j++) out += steps[j][2] || '';
      pc.querySelector('.console').innerHTML = out ? esc(out) : '<span class="muted">(nothing printed yet)</span>';
      note.innerHTML = md(txt || '');
      note.style.visibility = txt ? 'visible' : 'hidden';
      count.textContent = 'Step ' + (k + 1) + ' / ' + steps.length;
      bBack.disabled = k === 0;
      bNext.disabled = k === steps.length - 1;
      if (k === steps.length - 1 && timer) stop();
    }
    w.append(two, note, stepper);
    go(0);
    return w;
  }

  /* =====================================================================
     Memory visualiser (stack vs heap, SVG)
     step: { l, stack: [[frame, [[name, val, type?]]]], heap: [{id, type, f:[[name,val]]} | {id, type, arr:[..]}], note }
     A value '@id' is a reference to heap object id; 'null' is a null reference.
     ===================================================================== */
  const isRef = (v) => typeof v === 'string' && (v[0] === '@' || v === 'null');
  function drawMem(st, prev) {
    const SX = 14, SW = 250, HX = 350, HW = 230, ROW = 34, HEAD = 28;
    const parts = [];
    const anchors = {}; // object id -> {x,y,h}
    const srcs = []; // arrows
    let y = 34;
    const prevVals = {};
    if (prev) {
      (prev.stack || []).forEach(([fn, vars]) => vars.forEach(([n, v]) => (prevVals['s:' + fn + ':' + n] = String(v))));
      (prev.heap || []).forEach((ob) => (ob.f || []).forEach(([n, v]) => (prevVals['h:' + ob.id + ':' + n] = String(v))));
      (prev.heap || []).forEach((ob) => (ob.arr || []).forEach((v, i) => (prevVals['h:' + ob.id + ':' + i] = String(v))));
    }
    parts.push('<text x="' + SX + '" y="20" font-size="14" font-weight="800" fill="#544d69">STACK (method frames)</text>');
    parts.push('<text x="' + HX + '" y="20" font-size="14" font-weight="800" fill="#544d69">HEAP (objects)</text>');
    const stack = (st.stack || []).slice().reverse();
    stack.forEach(([fn, vars], fi) => {
      const h = HEAD + vars.length * ROW + 10;
      parts.push('<rect x="' + SX + '" y="' + y + '" width="' + SW + '" height="' + h + '" rx="16" fill="' + (fi === 0 ? '#c9efdf' : '#f8f5fd') + '" stroke="#b9acdf" stroke-width="1.5"/>');
      parts.push('<text x="' + (SX + 12) + '" y="' + (y + 19) + '" font-size="13" font-weight="800" class="mono" fill="#272238">' + esc(fn) + '</text>');
      vars.forEach(([n, v, ty], vi) => {
        const ry = y + HEAD + vi * ROW;
        const changed = prev && prevVals['s:' + fn + ':' + n] !== String(v);
        parts.push('<text x="' + (SX + 14) + '" y="' + (ry + 21) + '" font-size="13" class="mono" fill="#544d69">' + esc((ty ? ty + ' ' : '') + n) + '</text>');
        const bx = SX + SW - 104;
        parts.push('<rect x="' + bx + '" y="' + (ry + 4) + '" width="92" height="26" rx="9" fill="' + (changed ? '#fff0b3' : '#ffffff') + '" stroke="#cfc6ea"/>');
        if (isRef(v)) {
          if (v === 'null') parts.push('<text x="' + (bx + 46) + '" y="' + (ry + 22) + '" text-anchor="middle" font-size="13" class="mono" fill="#b3261e">null</text>');
          else {
            parts.push('<circle cx="' + (bx + 46) + '" cy="' + (ry + 17) + '" r="5" fill="#5b3fd0"/>');
            srcs.push({ x: bx + 46, y: ry + 17, to: v.slice(1), from: 'stack' });
          }
        } else parts.push('<text x="' + (bx + 46) + '" y="' + (ry + 22) + '" text-anchor="middle" font-size="13" font-weight="700" class="mono" fill="#272238">' + esc(v) + '</text>');
      });
      y += h + 14;
    });
    const stackBottom = y;
    // reachability
    const heap = st.heap || [];
    const byId = {};
    heap.forEach((o) => (byId[o.id] = o));
    const live = new Set();
    const visit = (id) => {
      if (!byId[id] || live.has(id)) return;
      live.add(id);
      const o = byId[id];
      (o.f || []).forEach(([, v]) => isRef(v) && v !== 'null' && visit(v.slice(1)));
      (o.arr || []).forEach((v) => isRef(v) && v !== 'null' && visit(v.slice(1)));
    };
    (st.stack || []).forEach(([, vars]) => vars.forEach(([, v]) => isRef(v) && v !== 'null' && visit(v.slice(1))));
    (st.roots || []).forEach(visit);
    let hy = 34;
    heap.forEach((o) => {
      const dead = !live.has(o.id);
      const op = dead ? ' opacity="0.45"' : '';
      let h;
      if (o.arr) {
        const cw = 46;
        const w = Math.max(HW, o.arr.length * cw + 20);
        h = HEAD + 58;
        parts.push('<g' + op + '><rect x="' + HX + '" y="' + hy + '" width="' + w + '" height="' + h + '" rx="16" fill="#cfe5ff" stroke="#8fb3e0" stroke-width="1.5"' + (dead ? ' stroke-dasharray="6 4"' : '') + '/>');
        parts.push('<text x="' + (HX + 12) + '" y="' + (hy + 19) + '" font-size="13" font-weight="800" class="mono" fill="#272238">' + esc(o.type) + (dead ? '  (garbage)' : '') + '</text>');
        o.arr.forEach((v, i) => {
          const cx = HX + 10 + i * cw;
          const changed = prev && prevVals['h:' + o.id + ':' + i] !== undefined && prevVals['h:' + o.id + ':' + i] !== String(v);
          parts.push('<rect x="' + cx + '" y="' + (hy + HEAD + 2) + '" width="' + (cw - 4) + '" height="28" rx="8" fill="' + (changed ? '#fff0b3' : '#fff') + '" stroke="#8fb3e0"/>');
          if (isRef(v) && v !== 'null') {
            parts.push('<circle cx="' + (cx + (cw - 4) / 2) + '" cy="' + (hy + HEAD + 16) + '" r="5" fill="#5b3fd0"/>');
            srcs.push({ x: cx + (cw - 4) / 2, y: hy + HEAD + 16, to: v.slice(1), from: 'heap', ox: HX + w });
          } else parts.push('<text x="' + (cx + (cw - 4) / 2) + '" y="' + (hy + HEAD + 21) + '" text-anchor="middle" font-size="12.5" font-weight="700" class="mono" fill="' + (v === 'null' ? '#b3261e' : '#272238') + '">' + esc(v) + '</text>');
          parts.push('<text x="' + (cx + (cw - 4) / 2) + '" y="' + (hy + HEAD + 46) + '" text-anchor="middle" font-size="11" class="mono" fill="#6f6887">[' + i + ']</text>');
        });
        parts.push('</g>');
        anchors[o.id] = { x: HX, y: hy + 14, r: HX + w };
      } else {
        const f = o.f || [];
        h = HEAD + f.length * ROW + 8;
        parts.push('<g' + op + '><rect x="' + HX + '" y="' + hy + '" width="' + HW + '" height="' + h + '" rx="16" fill="' + (o.color || '#ffd9c4') + '" stroke="#d9a98a" stroke-width="1.5"' + (dead ? ' stroke-dasharray="6 4"' : '') + '/>');
        parts.push('<text x="' + (HX + 12) + '" y="' + (hy + 19) + '" font-size="13" font-weight="800" class="mono" fill="#272238">' + esc(o.type) + (dead ? '  (garbage)' : '') + '</text>');
        f.forEach(([n, v], i) => {
          const ry = hy + HEAD + i * ROW;
          const changed = prev && prevVals['h:' + o.id + ':' + n] !== undefined && prevVals['h:' + o.id + ':' + n] !== String(v);
          parts.push('<text x="' + (HX + 14) + '" y="' + (ry + 20) + '" font-size="13" class="mono" fill="#544d69">' + esc(n) + '</text>');
          const bx = HX + HW - 112;
          parts.push('<rect x="' + bx + '" y="' + (ry + 3) + '" width="100" height="26" rx="9" fill="' + (changed ? '#fff0b3' : '#fff') + '" stroke="#e2c2ad"/>');
          if (isRef(v) && v !== 'null') {
            parts.push('<circle cx="' + (bx + 50) + '" cy="' + (ry + 16) + '" r="5" fill="#5b3fd0"/>');
            srcs.push({ x: bx + 50, y: ry + 16, to: v.slice(1), from: 'heap', ox: HX + HW });
          } else parts.push('<text x="' + (bx + 50) + '" y="' + (ry + 21) + '" text-anchor="middle" font-size="12.5" font-weight="700" class="mono" fill="' + (v === 'null' ? '#b3261e' : '#272238') + '">' + esc(v) + '</text>');
        });
        parts.push('</g>');
        anchors[o.id] = { x: HX, y: hy + 14, r: HX + HW };
      }
      hy += h + 18;
    });
    let loop = 0;
    const arrows = srcs.map((s) => {
      const a = anchors[s.to];
      if (!a) return '';
      if (s.from === 'stack') {
        return '<path d="M' + s.x + ',' + s.y + ' C' + (s.x + 70) + ',' + s.y + ' ' + (a.x - 60) + ',' + a.y + ' ' + (a.x - 4) + ',' + a.y + '" fill="none" stroke="#5b3fd0" stroke-width="2.2" marker-end="url(#mArrow)"/>';
      }
      loop += 1;
      const ex = Math.max(s.ox, a.r) + 22 + loop * 12;
      return '<path d="M' + s.x + ',' + s.y + ' C' + ex + ',' + s.y + ' ' + ex + ',' + a.y + ' ' + (a.r + 4) + ',' + a.y + '" fill="none" stroke="#c0569b" stroke-width="2.2" marker-end="url(#mArrow2)"/>';
    });
    const W = Math.max(640, ...Object.values(anchors).map((a) => a.r + 40 + loop * 12));
    const H = Math.max(stackBottom, hy) + 8;
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" role="img" aria-label="Stack and heap diagram"><defs>' +
      '<marker id="mArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b3fd0"/></marker>' +
      '<marker id="mArrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0569b"/></marker></defs>' +
      '<line x1="' + (HX - 40) + '" y1="8" x2="' + (HX - 40) + '" y2="' + (H - 4) + '" stroke="#cfc6ea" stroke-dasharray="4 6"/>' + parts.join('') + arrows.join('') + '</svg>';
  }
  Core.drawMem = drawMem;

  function memWidget(o) {
    const w = widgetShell('Memory visualiser', 'mem', o.title || 'Stack vs heap', o.sub || 'Step through the code. The yellow line has just run; the picture shows memory right after it. Purple arrows are references; faded, dashed objects are unreachable garbage.');
    const { node, rows } = codeBlock({ src: o.src, title: o.file || 'Main.java' }, { noOut: true, badge: '<span class="code-badge">Memory</span>' });
    const pic = make('div', 'svgwrap wide');
    const note = make('p', 'note-line');
    const con = o.steps.some((s) => s.out) ? make('div', 'console') : null;
    const stepper = make('div', 'stepper');
    let idx = 0;
    const bBack = btn('◀ Back', 'small', () => go(idx - 1));
    const bNext = btn('Next ▶', 'small primary', () => go(idx + 1));
    bNext.dataset.role = 'trace-next';
    const bReset = btn('⏮ Reset', 'small', () => go(0));
    const count = make('span', 'count');
    stepper.append(bReset, bBack, bNext, count);
    function go(k) {
      k = Math.max(0, Math.min(o.steps.length - 1, k));
      idx = k;
      const s = o.steps[k];
      rows.forEach((r, i) => r.classList.toggle('cur', i === s.l - 1));
      pic.innerHTML = drawMem(s, k ? o.steps[k - 1] : null);
      note.innerHTML = md(s.note || '');
      if (con) {
        let out = '';
        for (let j = 0; j <= k; j++) out += o.steps[j].out || '';
        con.innerHTML = out ? esc(out) : '<span class="muted">(nothing printed yet)</span>';
      }
      count.textContent = 'Step ' + (k + 1) + ' / ' + o.steps.length;
      bBack.disabled = k === 0;
      bNext.disabled = k === o.steps.length - 1;
    }
    w.append(node, stepper, note, pic);
    if (con) w.appendChild(con);
    go(0);
    return w;
  }

  /* =====================================================================
     Predict the output
     ===================================================================== */
  const norm = (s) => String(s).replace(/\r/g, '').split('\n').map((l) => l.replace(/\s+$/, '')).join('\n').replace(/\n+$/, '').replace(/^\n+/, '');
  function predictWidget(o) {
    const w = widgetShell('Predict the output', 'pred', o.title || 'What does this print?', o.sub || 'Type exactly what you think appears on the console, one line per line of output, then press Check.');
    w.appendChild(codeBlock({ src: o.src, title: o.file || 'Main.java' }, { noOut: true, badge: '<span class="code-badge">Predict</span>' }).node);
    const id = uid('pred');
    const field = make('div', 'field', '<label for="' + id + '">Your prediction</label>');
    const ta = make('textarea');
    ta.id = id;
    ta.rows = Math.min(8, Math.max(2, o.answer.split('\n').length + 1));
    ta.spellcheck = false;
    ta.placeholder = 'Type the output here…';
    field.appendChild(ta);
    const fb = make('div');
    const row = make('div', 'row');
    let tries = 0;
    const reveal = (good) => {
      fb.innerHTML = '';
      const box = make('div', 'feedback ' + (good ? 'good' : 'info'));
      box.innerHTML = '<div class="' + (good ? 'ok-msg' : '') + '">' + (good ? '✅ Exactly right!' : '👀 Here is the actual output') + '</div><div class="console"></div><div class="walk"><b>Walkthrough:</b> </div>';
      box.querySelector('.console').textContent = o.answer;
      const walk = box.querySelector('.walk');
      renderBody(o.explain, walk);
      fb.appendChild(box);
    };
    row.append(
      btn('Check my answer', 'primary', () => {
        const a = norm(ta.value), b = norm(o.answer);
        tries++;
        if (a === b) return reveal(true);
        fb.innerHTML = '';
        const close = a.replace(/\s+/g, '').toLowerCase() === b.replace(/\s+/g, '').toLowerCase();
        const box = make('div', 'feedback badf', '<div class="bad-msg">' + (a ? (close ? '🤏 Very close: check spacing, capitals and line breaks.' : '❌ Not quite. Trace it again line by line.') : '✍️ Type a prediction first.') + '</div>' + (o.hint && a ? '<div>💡 Hint: ' + md(o.hint) + '</div>' : ''));
        fb.appendChild(box);
        w.classList.remove('shake');
        void w.offsetWidth;
        w.classList.add('shake');
      }),
      btn('Show answer & walkthrough', 'butter', () => reveal(false))
    );
    w.append(field, row, fb);
    return w;
  }

  /* =====================================================================
     Bug hunt: click the buggy line
     ===================================================================== */
  function bugWidget(o) {
    const w = widgetShell('Bug hunt', 'bug', o.title || 'Find the bug', o.sub || 'Click the line that contains the bug.');
    const cb = codeBlock({ src: o.src, title: o.file || 'Buggy.java' }, { noOut: true, badge: '<span class="code-badge bad">🐞 Has a bug</span>' });
    cb.node.classList.add('clickable');
    const fb = make('div');
    let solved = false;
    const finish = (found) => {
      solved = true;
      cb.rows.forEach((r, i) => r.classList.toggle('miss', i === o.line - 1));
      fb.innerHTML = '';
      const box = make('div', 'feedback ' + (found ? 'good' : 'info'));
      box.innerHTML = '<div class="' + (found ? 'ok-msg' : '') + '">' + (found ? '🎉 You found it: line ' + o.line + '.' : '🔦 The bug is on line ' + o.line + '.') + '</div>';
      const why = make('div');
      renderBody(o.why, why);
      box.appendChild(why);
      fb.appendChild(box);
      if (o.fix) {
        const f = codeBlock(Object.assign({ title: 'Fixed version', ctx: o.ctx }, o.fix), { runnable: true }).node;
        f.style.marginTop = '12px';
        fb.appendChild(f);
      }
    };
    cb.rows.forEach((r, i) => {
      r.tabIndex = 0;
      r.setAttribute('role', 'button');
      r.setAttribute('aria-label', 'Line ' + (i + 1));
      const pick = () => {
        if (solved) return;
        if (i === o.line - 1) return finish(true);
        r.classList.add('dim');
        fb.innerHTML = '<div class="feedback badf"><div class="bad-msg">Line ' + (i + 1) + ' is fine. Keep looking!</div>' + (o.hint ? '<div>💡 Hint: ' + md(o.hint) + '</div>' : '') + '</div>';
      };
      r.addEventListener('click', pick);
      r.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          pick();
        }
      });
    });
    const row = make('div', 'row');
    row.appendChild(btn('Reveal the bug', 'small butter', () => !solved && finish(false)));
    w.append(cb.node, row, fb);
    return w;
  }

  /* =====================================================================
     Verdict: compiles / compile error / runtime error
     ===================================================================== */
  const VERD = { ok: '✅ Compiles & runs', compile: '🛑 Compile error', runtime: '💥 Runtime exception' };
  function verdictWidget(o) {
    const w = widgetShell('Will it compile?', 'verd', o.title || 'Compile, crash, or run?', o.sub || 'For each snippet, decide what happens. Each one runs inside {{main}}' + (o.preShow ? ' after the setup shown' : '') + '.');
    if (o.preShow) w.appendChild(codeBlock({ src: o.preShow, title: 'Setup used by every snippet' }, { noOut: true }).node);
    const score = make('p', 'widget-sub');
    let right = 0, done = 0;
    const upd = () => (score.innerHTML = '<b>Score:</b> ' + right + ' / ' + done + ' answered (of ' + o.items.length + ')');
    upd();
    w.appendChild(score);
    o.items.forEach((it) => {
      const box = make('div', 'verdict-item');

  /* =====================================================================

  const gen = (Core.gen = {});
  const i32 = (x) => x | 0;
  function jd(x) {
    if (Number.isNaN(x)) return 'NaN';
    if (x === Infinity) return 'Infinity';
    if (x === -Infinity) return '-Infinity';
    if (x === 0) return Object.is(x, -0) ? '-0.0' : '0.0';
    const a = Math.abs(x);
    if (a >= 1e-3 && a < 1e7) {
      let s = String(x);
      if (!/[.e]/.test(s)) s += '.0';
      return s;
    }
    let [m, e] = x.toExponential().split('e');
    if (!m.includes('.')) m += '.0';
    return m + 'E' + parseInt(e, 10);
  }
  Core.jd = jd;

  // Loop playground
  gen.loop = function (s) {
    const upd = { 'i++': (i) => i32(i + 1), 'i += 2': (i) => i32(i + 2), 'i--': (i) => i32(i - 1), 'i -= 2': (i) => i32(i - 2), 'i *= 2': (i) => i32(i * 2) }[s.upd];
    const cmp = { '<': (a, b) => a < b, '<=': (a, b) => a <= b, '>': (a, b) => a > b, '>=': (a, b) => a >= b, '!=': (a, b) => a !== b }[s.op];
    const body = { sum: 'sum += i;', squares: 'sum += i * i;', print: 'System.out.print(i + " ");' }[s.body];
    const usesSum = s.body !== 'print';
    const cond = 'i ' + s.op + ' ' + s.end;
    const u = s.upd.replace('i', 'i');
    let lines = [];
    if (usesSum) lines.push('int sum = 0;');
    if (s.kind === 'for') {
      lines.push('for (int i = ' + s.start + '; ' + cond + '; ' + u + ') {', '    ' + body, '}');
    } else if (s.kind === 'while') {
      lines.push('int i = ' + s.start + ';', 'while (' + cond + ') {', '    ' + body, '    ' + u + ';', '}');
    } else {
      lines.push('int i = ' + s.start + ';', 'do {', '    ' + body, '    ' + u + ';', '} while (' + cond + ');');
    }
    lines.push(usesSum ? 'System.out.println("sum = " + sum);' : 'System.out.println();');
    const rows = [];
    let i = s.start, sum = 0, out = '', n = 0, stopped = false;
    const LIMIT = 60;
    const runBody = () => {
      if (s.body === 'sum') sum = i32(sum + i);
      else if (s.body === 'squares') sum = i32(sum + i32(Math.imul(i, i)));
      else out += i + ' ';
    };
    if (s.kind === 'do') {
      for (;;) {
        const before = i;
        runBody();
        i = upd(i);
        const c = cmp(i, s.end);
        rows.push({ i: before, cond: c, sum, after: i });
        if (!c) break;
        if (++n >= LIMIT) { stopped = true; break; }
      }
    } else {
      for (;;) {
        const c = cmp(i, s.end);
        if (!c) { rows.push({ i, cond: false, sum, after: i, exit: true }); break; }
        runBody();
        rows.push({ i, cond: true, sum, after: upd(i) });
        i = upd(i);
        if (++n >= LIMIT) { stopped = true; break; }
      }
    }
    out = usesSum ? 'sum = ' + sum + '\n' : out + '\n';
    return { code: lines.join('\n'), rows, out, stopped, body: lines.map((l) => '        ' + l).join('\n') };
  };

  // switch fall-through
  gen.sw = function (v, brk, withDefault) {
    const cases = [[-1, 'Negative'], [1, 'Positive'], [0, 'Zero']];
    const L = ['switch (v) {'];
    const lineOf = [];
    cases.forEach(([c, word], k) => {
      L.push('    case ' + c + ':');
      lineOf.push(L.length);
      L.push('        System.out.println("' + word + '");');
      if (brk[k]) L.push('        break;');
    });
    if (withDefault) {
      L.push('    default:');
      lineOf.push(L.length);
      L.push('        System.out.println("Unknown");');
    }
    L.push('}');
    let start = cases.findIndex(([c]) => c === v);
    if (start < 0) start = withDefault ? 3 : -1;
    const out = [];
    const hit = new Set();
    if (start >= 0) {
      for (let k = start; k < (withDefault ? 4 : 3); k++) {
        const word = k < 3 ? cases[k][1] : 'Unknown';
        out.push(word);
        hit.add(lineOf[k] + 1);
        if (k < 3 && brk[k]) break;
      }
    }
    return { code: L.join('\n'), out: out.length ? out.join('\n') + '\n' : '', hit };
  };

  // integer and double arithmetic
  gen.arith = function (a, b) {
    const rows = [];
    const intDiv = b === 0 ? null : Math.trunc(a / b);
    const intMod = b === 0 ? null : a % b;
    const AE = 'ArithmeticException: / by zero';
    rows.push(['a / b', 'int', b === 0 ? AE : String(i32(intDiv))]);
    rows.push(['a % b', 'int', b === 0 ? AE : String(intMod === 0 ? 0 : intMod)]);
    rows.push(['(double) a / b', 'double', jd(a / b)]);
    rows.push(['(double) (a / b)', 'double', b === 0 ? AE : jd(intDiv)]);
    rows.push(['a / 2.0', 'double', jd(a / 2)]);
    rows.push(['a * 1.0 / b', 'double', jd((a * 1.0) / b)]);
    return rows;
  };

  // Java String.hashCode and HashMap bucket index
  gen.hash = function (s) {
    let h = 0;
    for (let i = 0; i < s.length; i++) h = i32(Math.imul(31, h) + s.charCodeAt(i));
    return h;
  };
  gen.spread = (h) => i32(h ^ (h >>> 16));
  // Simulate java.util.HashMap iteration order (insertion into buckets, resize at 0.75 load)
  gen.hashOrder = function (keys) {
    let cap = 16;
    let table = Array.from({ length: cap }, () => []);
    let size = 0;
    const seen = new Set();
    const resize = () => {
      const old = table;
      cap *= 2;
      table = Array.from({ length: cap }, () => []);
      old.forEach((bucket) => bucket.forEach((k) => table[gen.spread(gen.hash(k)) & (cap - 1)].push(k)));
    };
    keys.forEach((k) => {
      if (seen.has(k)) return;
      seen.add(k);
      table[gen.spread(gen.hash(k)) & (cap - 1)].push(k);
      if (++size > cap * 0.75) resize();
    });
    return { order: [].concat(...table), cap };
  };
  gen.hashRemove = function (keys, removed) {
    // order after inserting keys (in order) then removing some; removal keeps others' relative order
    const r = gen.hashOrder(keys);
    return r.order.filter((k) => !removed.includes(k));
  };

  gen.boxing = (v) => ({ same: v >= -128 && v <= 127, equals: true });

  // Comparator sorting (stable, like Java's TimSort for objects)
  const cmpStr = (a, b) => {
    const n = Math.min(a.length, b.length);
    for (let i = 0; i < n; i++) if (a.charCodeAt(i) !== b.charCodeAt(i)) return a.charCodeAt(i) - b.charCodeAt(i);
    return a.length - b.length;
  };
  const cmpCI = (a, b) => {
    const n = Math.min(a.length, b.length);
    for (let i = 0; i < n; i++) {
      let c1 = a[i], c2 = b[i];
      if (c1 !== c2) {
        c1 = c1.toUpperCase(); c2 = c2.toUpperCase();
        if (c1 !== c2) {
          c1 = c1.toLowerCase(); c2 = c2.toLowerCase();
          if (c1 !== c2) return c1.charCodeAt(0) - c2.charCodeAt(0);
        }
      }
    }
    return a.length - b.length;
  };
  gen.comparators = {
    natural: { code: 'Arrays.sort(words);', f: cmpStr, label: 'Natural (alphabetical) order' },
    length: { code: 'Arrays.sort(words, (s1, s2) -> s1.length() - s2.length());', f: (a, b) => a.length - b.length, label: 'By length (lambda)' },
    reverse: { code: 'Arrays.sort(words, Comparator.reverseOrder());', f: (a, b) => cmpStr(b, a), label: 'Reverse natural order' },
    lenThenAlpha: { code: 'Arrays.sort(words, Comparator.comparingInt(String::length)\n                         .thenComparing(Comparator.naturalOrder()));', f: (a, b) => a.length - b.length || cmpStr(a, b), label: 'By length, then alphabetical' },
    ci: { code: 'Arrays.sort(words, String.CASE_INSENSITIVE_ORDER);', f: cmpCI, label: 'Case-insensitive' },
  };
  gen.sortWith = (words, key) => {
    const f = gen.comparators[key].f;

  };

  // Stream pipeline (lazy, sequential)
  gen.stream = function (words, minLen, mapKey, limit, terminal) {
    const maps = {
      none: { code: '', f: (w) => w },
      upper: { code: '.map(String::toUpperCase)', f: (w) => w.toUpperCase() },
      first: { code: '.map(w -> w.substring(0, 1))', f: (w) => w.substring(0, 1) },
      length: { code: '.map(String::length)', f: (w) => w.length },
    };
    const lines = ['List<String> words = List.of(' + words.map((w) => '"' + w + '"').join(', ') + ');'];
    let pipe = 'words.stream()\n    .filter(w -> w.length() > ' + minLen + ')';
    if (maps[mapKey].code) pipe += '\n    ' + maps[mapKey].code;
    if (limit > 0) pipe += '\n    .limit(' + limit + ')';
    const T = mapKey === 'length' ? 'Integer' : 'String';
    if (terminal === 'count') lines.push('long n = ' + pipe + '\n    .count();', 'System.out.println(n);');
    else if (terminal === 'toList') lines.push('List<' + T + '> result = ' + pipe + '\n    .toList();', 'System.out.println(result);');
    else lines.push('Optional<' + T + '> first = ' + pipe + '\n    .findFirst();', 'System.out.println(first);');
    const events = [];
    const result = [];
    let pulled = 0;
    for (const w of words) {
      if (terminal === 'findFirst' && result.length >= 1) break;
      if (limit > 0 && result.length >= limit) break;
      pulled++;
      const pass = w.length > minLen;
      if (!pass) { events.push({ w, pass, mapped: null }); continue; }
      const m = maps[mapKey].f(w);
      events.push({ w, pass, mapped: m });
      result.push(m);
    }
    let out;
    if (terminal === 'count') out = String(result.length);
    else if (terminal === 'toList') out = gen.jlist(result);
    else out = result.length ? 'Optional[' + result[0] + ']' : 'Optional.empty';
    return { code: lines.join('\n'), events, pulled, out: out + '\n', result };
  };

  gen.exflow = function (catchAt, withFinally, bad) {
    const L = [];
    const ln = {};
    const add = (s, tag) => { L.push(s); if (tag) ln[tag] = L.length; };
    add('public class Orders {');
    add('    static int parse(String qty) {');
    if (catchAt === 'parse') { add('        try {'); add('            return Integer.parseInt(qty);', 'throw'); add('        } catch (NumberFormatException e) {'); add('            System.out.println("parse: bad quantity");', 'cParse'); add('            return 0;'); add('        }'); }
    else add('        return Integer.parseInt(qty);', 'throw');
    add('    }');
    add('    static void process(String qty) {');
    if (catchAt === 'process' || withFinally) add('        try {');
    const ind = catchAt === 'process' || withFinally ? '    ' : '';
    add(ind + '        int n = parse(qty);', 'callParse');
    add(ind + '        System.out.println("process: got " + n);', 'pOk');
    if (catchAt === 'process') { add('        } catch (NumberFormatException e) {'); add('            System.out.println("process: caught " + e.getMessage());', 'cProc'); }
    if (withFinally) { add('        } finally {'); add('            System.out.println("process: finally runs");', 'fin'); }
    if (catchAt === 'process' || withFinally) add('        }');
    add('        System.out.println("process: done");', 'pDone');
    add('    }');
    add('    public static void main(String[] args) {');
    if (catchAt === 'main') add('        try {');
    const ind2 = catchAt === 'main' ? '    ' : '';
    add(ind2 + '        process("' + (bad ? '12a' : '12') + '");', 'callProc');
    add(ind2 + '        System.out.println("main: after process");', 'mAfter');
    if (catchAt === 'main') { add('        } catch (NumberFormatException e) {'); add('            System.out.println("main: caught " + e.getMessage());', 'cMain'); add('        }'); }
    add('        System.out.println("main: end");', 'mEnd');
    add('    }');
    add('}');
    const out = [];
    const path = [];
    let err = '';
    const msg = 'For input string: "12a"';
    const n = bad ? (catchAt === 'parse' ? 0 : null) : 12;
    // simulate
    path.push(['main', ln.callProc], ['process', ln.callParse], ['parse', ln.throw]);
    let thrown = bad;
    if (thrown && catchAt === 'parse') { out.push('parse: bad quantity'); thrown = false; path.push(['parse', ln.cParse]); }
    let procCompletes = false;
    if (!thrown) {
      out.push('process: got ' + n);
      path.push(['process', ln.pOk]);
      if (withFinally) { out.push('process: finally runs'); path.push(['process', ln.fin]); }
      out.push('process: done');
      procCompletes = true;
    } else {
      path.push(['process', ln.callParse, 'unwind']);

        out.push('process: caught ' + msg);

        procCompletes = true;

  /* ---- Hierarchy tree ---- */
  WG.tree = function (o) {
    const w = widgetShell('Visual', 'mem', o.title || 'Class hierarchy', o.sub || 'Click a box to learn about it. Solid arrows mean extends; dashed arrows mean implements.');
    const nodes = o.nodes.map((n) => Object.assign({ kids: [] }, n));
    const byId = {};
    nodes.forEach((n) => (byId[n.id] = n));
    const roots = [];
    nodes.forEach((n) => (n.parent && byId[n.parent] ? byId[n.parent].kids.push(n) : roots.push(n)));
    const NW = o.nodeW || 150, NH = 46, GX = 16, GY = 88;
    let nextX = 14;
    const place = (n, d) => {
      n.depth = n.depth != null ? n.depth : d;
      if (!n.kids.length) { n.x = nextX; nextX += NW + GX; }
      else { n.kids.forEach((k) => place(k, n.depth + 1)); n.x = (n.kids[0].x + n.kids[n.kids.length - 1].x) / 2; }
    };
    roots.forEach((r) => place(r, r.depth || 0));
    const maxD = Math.max(...nodes.map((n) => n.depth));
    const W = nextX, H = 30 + (maxD + 1) * GY;
    const info = make('div', 'feedback info', md(o.hint || 'Click any box.'));
    const pic = make('div', 'svgwrap wide');
    const color = { class: '#ffd9c4', abstract: '#fff0b3', interface: '#c9efdf', final: '#ffd3df', root: '#ddd3ff' };
    function render(selId) {
      let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" role="img" aria-label="' + esc(o.title || 'hierarchy') + '"><defs><marker id="tA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fff" stroke="#544d69"/></marker></defs>';
      const cy = (n) => 16 + n.depth * GY;
      nodes.forEach((n) => {
        if (n.parent && byId[n.parent]) {
          const p = byId[n.parent];
          const impl = p.kind === 'interface' && n.kind !== 'interface';
          s += '<path d="M' + (n.x + NW / 2) + ',' + cy(n) + ' C' + (n.x + NW / 2) + ',' + (cy(n) - 28) + ' ' + (p.x + NW / 2) + ',' + (cy(p) + NH + 28) + ' ' + (p.x + NW / 2) + ',' + (cy(p) + NH + 2) + '" fill="none" stroke="' + (impl ? '#1f7a4d' : '#544d69') + '" stroke-width="1.8"' + (impl ? ' stroke-dasharray="6 5"' : '') + ' marker-end="url(#tA)"/>';
        }
        (n.impl || []).forEach((iid) => {
          const p = byId[iid];
          if (!p) return;
          s += '<path d="M' + (n.x + NW / 2) + ',' + cy(n) + ' C' + (n.x + NW / 2) + ',' + (cy(n) - 30) + ' ' + (p.x + NW / 2) + ',' + (cy(p) + NH + 30) + ' ' + (p.x + NW / 2) + ',' + (cy(p) + NH + 2) + '" fill="none" stroke="#1f7a4d" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#tA)"/>';
        });
      });
      nodes.forEach((n) => {
        const on = n.id === selId;
        s += '<g class="tnode" data-id="' + esc(n.id) + '" tabindex="0" role="button" style="cursor:pointer"><rect x="' + n.x + '" y="' + cy(n) + '" width="' + NW + '" height="' + NH + '" rx="14" fill="' + (color[n.kind] || color.class) + '" stroke="' + (on ? '#5b3fd0' : '#b9acdf') + '" stroke-width="' + (on ? 3 : 1.5) + '"/>';
        if (n.kind && n.kind !== 'class') s += '<text x="' + (n.x + NW / 2) + '" y="' + (cy(n) + 16) + '" text-anchor="middle" font-size="10.5" fill="#544d69">«' + esc(n.kind) + '»</text>';
        s += '<text x="' + (n.x + NW / 2) + '" y="' + (cy(n) + (n.kind && n.kind !== 'class' ? 34 : 28)) + '" text-anchor="middle" font-size="13" font-weight="800" class="mono" fill="#272238"' + (n.kind === 'abstract' || n.kind === 'interface' ? ' font-style="italic"' : '') + '>' + esc(n.label || n.id) + '</text></g>';
      });
      s += '</svg>';
      pic.innerHTML = s;
      pic.querySelectorAll('.tnode').forEach((g) => {
